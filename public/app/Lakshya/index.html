<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif}.top{height:68px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #0001;position:sticky;top:0;z-index:20;background:#f4efe5ee;backdrop-filter:blur(16px)}.brand{display:flex;gap:11px;align-items:center}.mark{width:30px;height:30px;border-radius:50%;background:repeating-conic-gradient(var(--saff) 0 14deg,#e8c995 14deg 28deg);box-shadow:inset 0 0 0 6px var(--paper)}.brand strong{font:400 19px Georgia,serif}.brand small{display:block;font-size:8px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}.top button,.back{border:0;background:none;color:var(--muted);cursor:pointer}.shell{max-width:1240px;margin:auto;padding:30px 28px 80px}.progress{display:flex;gap:5px;margin-bottom:42px}.progress i{height:3px;flex:1;background:#ddd5c7;border-radius:9px}.progress i.on{background:linear-gradient(90deg,var(--saff),var(--gold))}.scene{animation:in .55s cubic-bezier(.2,.8,.2,1)}@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}h1,h2,h3{font-family:Georgia,serif;font-weight:400}h2{font-size:clamp(40px,5vw,68px);line-height:.94;letter-spacing:-.045em;margin:0 0 14px}h3{font-size:24px;margin:0 0 9px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--saff);margin-bottom:16px}.intro{max-width:760px;color:var(--muted);line-height:1.55}.hero{min-height:68vh;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:50px}.hero h1{font-size:clamp(62px,9vw,120px);line-height:.8;letter-spacing:-.07em;margin:0}.hero h1 em{font-style:normal;color:var(--saff)}.hero p{font:22px/1.4 Georgia,serif;color:#655e56;max-width:620px;margin:28px 0}.mandala{max-width:430px;width:100%;aspect-ratio:1;margin:auto;border-radius:50%;background:repeating-conic-gradient(transparent 0 11deg,#d7793226 11.5deg 12.5deg,transparent 13deg 24deg),radial-gradient(circle,#ddb15d 0 2%,transparent 2.5% 17%,#357b7628 17.5% 18%,transparent 18.5% 32%,#ad687d25 32.5% 33%,transparent 33.5% 48%,#d7793222 48.5% 49%,transparent 49.5%);position:relative;animation:spin 40s linear infinite}.mandala:after{content:'LAKSHYA';position:absolute;inset:0;display:grid;place-items:center;font:400 35px Georgia,serif;color:#936434;letter-spacing:.16em}.mandala:before{content:'PRACTICE  ·  PATTERN  ·  POSSIBILITY';position:absolute;inset:10%;display:grid;place-items:end center;padding-bottom:26px;font-size:8px;letter-spacing:.17em;color:#90775d}@keyframes spin{to{transform:rotate(360deg)}}.action{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--ink);color:#fff;padding:13px 18px;font-weight:800;cursor:pointer}.action.secondary{background:#e9e1d4;color:var(--ink)}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}.drop{border:1px dashed #bfb29f;border-radius:24px;padding:44px 25px;text-align:center;background:#fbf8f1;margin:28px 0}.drop input{display:none}.drop label{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer}.urlrow{display:flex;gap:8px;max-width:700px;margin:18px auto}.urlrow input,.field input,.field textarea,.inline-input{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 12px;font:inherit;outline:none}.urlrow input{flex:1}.status{margin-top:15px;font-size:12px;color:var(--muted);min-height:18px}.status strong{color:var(--ink)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:21px;position:relative;overflow:hidden}.card:after{content:'✦';position:absolute;right:14px;top:9px;color:#b8955040}.num{font:400 42px Georgia,serif}.muted{color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:44px 0 15px}.section-head h3{margin:0}.table-wrap{background:var(--card);border:1px solid var(--line);border-radius:19px;overflow:auto}.data-table{border-collapse:collapse;width:100%;min-width:980px;font-size:12px}.data-table th{text-align:left;background:#f0eadf;color:#655e56;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:12px;border-bottom:1px solid var(--line);position:sticky;top:0}.data-table td{padding:12px;border-bottom:1px solid #eee8de;vertical-align:top}.data-table tr:last-child td{border:0}.tag{display:inline-block;padding:5px 8px;border-radius:99px;background:#eee7db;margin:2px}.tag.saff{background:#f1dcc9}.tag.teal{background:#dcebe8}.tag.indigo{background:#e1e5f1}.source-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.source{background:#eee7db;border-radius:99px;padding:7px 10px;font-size:11px}.dashboard{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.vizbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.vizbar button{border:1px solid var(--line);background:#f7f1e8;border-radius:999px;padding:8px 11px;cursor:pointer}.vizbar button.on{background:var(--ink);color:#fff}.chart{min-height:330px;display:grid;place-items:center}.chart svg{width:100%;height:330px}.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:11px}.legend span{display:flex;align-items:center;gap:5px}.sw{width:9px;height:9px;border-radius:50%;display:inline-block}.timeline{position:relative;padding:25px 5px}.timeline:before{content:'';position:absolute;left:8%;right:8%;top:63px;height:2px;background:#d3c8b7}.milestones{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;position:relative}.milestone{text-align:center}.dotx{width:14px;height:14px;border-radius:50%;background:var(--saff);margin:28px auto 14px;box-shadow:0 0 0 6px #d7793220}.milestone b{font:400 19px Georgia,serif}.milestone small{display:block;color:var(--muted);margin-top:5px;line-height:1.35}.strength-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.strength-row{display:grid;grid-template-columns:180px 1fr 44px;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee7dc}.strength-row input{width:100%;accent-color:var(--saff)}.rec{background:#f1dfcd;border:1px solid #e3c3a2;padding:11px 13px;border-radius:11px;font-size:12px;margin-bottom:12px}.capsules{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.capsule{border:1px solid var(--line);background:#fff;padding:10px 13px;border-radius:99px;cursor:pointer}.capsule.sel{background:var(--ink);color:#fff;border-color:var(--ink)}.radar{width:330px;max-width:100%;aspect-ratio:1;border-radius:50%;margin:12px auto;background:repeating-radial-gradient(circle,#fffdf8 0 19%,#e9e1d4 19.5% 20%,#fffdf8 20.5% 39%,#e9e1d4 39.5% 40%,#fffdf8 40.5% 59%,#e9e1d4 59.5% 60%,#fffdf8 60.5%);position:relative;border:1px solid var(--line)}.radar:before,.radar:after{content:'';position:absolute;background:#d0c5b4}.radar:before{height:1px;left:0;right:0;top:50%}.radar:after{width:1px;top:0;bottom:0;left:50%}.rpoint{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--saff);box-shadow:0 0 0 6px #d7793225}.market-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.signal{display:grid;grid-template-columns:170px 1fr 42px;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #eee7dc}.bar{height:7px;background:#e7dfd2;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--saff),var(--gold))}.note{padding:14px 17px;background:#eee8dc;border-left:3px solid var(--saff);border-radius:10px;line-height:1.5;margin:17px 0}.report{background:#171715;color:#f7f1e8;border-radius:24px;padding:28px}.report p{color:#c4b9aa}.road{display:grid;grid-template-columns:repeat(7,1fr);margin-top:24px;border-top:2px solid #d5b77e}.road div{padding:15px 11px;border-left:1px solid #ffffff1d;min-height:110px}.road b{font:400 19px Georgia,serif}.road small{display:block;color:#aaa093;margin-top:8px;line-height:1.35}.report .accent{color:#e1aa68}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.resource{display:grid;grid-template-columns:80px 1fr 100px;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #eee7dc}.resource b{font:400 20px Georgia,serif}.feedback{max-width:700px}.stars{display:flex;gap:7px;margin:15px 0}.stars button{border:1px solid var(--line);background:#fff;border-radius:9px;width:42px;height:42px;cursor:pointer}.stars button.sel{background:var(--saff);color:#fff;border-color:var(--saff)}.print-only{display:none}@media(max-width:850px){.hero,.dashboard,.strength-grid,.market-grid,.two{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.milestones{grid-template-columns:repeat(3,1fr)}.timeline:before{display:none}.road{overflow:auto;grid-template-columns:repeat(7,145px)}.top{padding:0 16px}.shell{padding:24px 16px 60px}.strength-row{grid-template-columns:120px 1fr 40px}}@media print{.top,.progress,.bottom,.vizbar,.drop,.feedback-actions{display:none!important}.shell{padding:0}.card,.report,.table-wrap{break-inside:avoid}.print-only{display:block}.scene{animation:none}}

<body>
<header class="top"><div class="brand"><span class="mark"></span><div><strong>Lakshya</strong><small>Beyond the Portfolio</small></div></div><div><button onclick="exportExcel()">Excel</button> <button onclick="resetLab()">Reset</button> <button onclick="window.print()">Print / PDF</button></div></header>
<div class="shell"><div class="progress" id="progress"></div><main id="main"></main></div>
<script>
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const steps=['Evidence','Dashboard','Strengths','Preferences','Market','Career Map','Resources','Feedback'];
const hardCatalog=['Interaction design','Research','Prototyping','Design systems','Visual design','Product strategy','Service design','AI interaction design','Information architecture','Accessibility','Content design','Motion design','Data visualisation'];
const softCatalog=['Strategic thinking','Facilitation','Storytelling','Leadership','Collaboration','Communication','Mentoring','Stakeholder management','Systems thinking','Judgement','Negotiation'];
const pursuits=['Research','Interaction design','Visual design','Design systems','Product strategy','AI / emerging technology','Service design','Content design','Education / mentoring','Leadership','Entrepreneurship','Creative practice'];
const marketSignals=[
['AI-native experience design',92,[48,56,63,70,78,86,92]],
['AI fluency for designers',94,[35,46,58,68,76,87,94]],
['Design systems',82,[57,60,64,69,74,78,82]],
['Product strategy',86,[55,59,64,70,76,81,86]],
['Research + judgement',84,[61,64,68,71,76,80,84]],
['Visual craft alone',48,[82,78,73,68,62,55,48]]
];
const resources=[
['AI','AI UX patterns','Learn probabilistic UX, agents, trust and human oversight.','Explore'],
['Systems','Design systems','Study tokens, governance, composition and scale.','Explore'],
['Strategy','Product strategy','Strengthen business fluency and outcome framing.','Explore'],
['Research','Research','Refresh generative research, usability and synthesis.','Explore'],
['Craft','Portfolio craft','Build decision narratives, not project galleries.','Explore']
];
let state={step:0,sources:[],rows:[],raw:'',skills:{hard:[],soft:[]},strength:{},interests:{},market:{},future:{},feedback:{rating:0,note:''},viz:'skills'};
const key='lakshya.v2';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(key,JSON.stringify(state))}
function load(){try{Object.assign(state,JSON.parse(localStorage.getItem(key)||'{}'))}catch(e){}}
function resetLab(){if(confirm('Reset this participant journey?')){localStorage.removeItem(key);location.reload()}}
function nav(){document.getElementById('progress').innerHTML=steps.map((x,i)=>'<i class="'+(i<=state.step?'on':'')+'"></i>').join('')}
function canGo(i){return i<=state.step||i===state.step+1}
function go(i){if(i>state.step&&!ready())return;state.step=i;save();draw();scrollTo(0,0)}
function ready(){if(state.step===0)return state.rows.length>0||state.sources.some(s=>s.ok);if(state.step===2)return state.skills.hard.length+state.skills.soft.length>0; if(state.step===3)return Object.values(state.interests).filter(x=>x.selected).length===5;return true}
function next(){if(ready()){state.step=Math.min(7,state.step+1);save();draw();scrollTo(0,0)}else alert(state.step===0?'Add at least one readable source first.':state.step===3?'Choose exactly five preferences.':'Finish the current activity first.')}
function shell(k,t,intro,body=true){return '<section class="scene"><div class="eyebrow">'+k+'</div><h2>'+t+'</h2><p class="intro">'+intro+'</p>'+body+'<div class="bottom"><button class="back" onclick="go('+Math.max(0,state.step-1)+')">← Back</button><button class="action" onclick="next()">'+(state.step===7?'Finish':'Continue →')+'</button></div></section>'}
function home(){return '<section class="hero scene"><div><div class="eyebrow">THE CAREER PRACTICE LAB</div><h1>Career<br><em>Lakshya.</em></h1><p>Your career has patterns. Your next move is hidden somewhere inside them.</p><div class="drop" style="margin:24px 0"><h3>Start with your evidence.</h3><p class="muted">Upload one or many files, or paste a public portfolio link. That is all you need to begin.</p><input id="fileInput" type="file" multiple><label for="fileInput">Upload your evidence</label><div class="urlrow"><input id="urlInput" placeholder="https://yourportfolio.com"><button class="action secondary" onclick="addUrl()">Add link</button></div><div id="status" class="status"></div></div></div><div class="mandala"></div></section>'}
function evidence(){let files=state.sources.map(s=>'<span class="source">'+(s.ok?'✓':'!')+' '+esc(s.name)+'</span>').join('');return shell('01 · YOUR EVIDENCE','Give the lab your career story.','Upload one or many files, or paste a public portfolio link. The lab will parse the material, find evidence, and turn it into a structured career record.','<div class="drop"><h3>Drop your evidence here.</h3><p class="muted">PDF, DOCX, PPTX, XLSX, CSV, TXT, Markdown, JSON, images and more.</p><input id="fileInput" type="file" multiple><label for="fileInput">Choose files</label><div class="urlrow"><input id="urlInput" placeholder="https://yourportfolio.com"><button class="action secondary" onclick="addUrl()">Add portfolio link</button></div><div id="status" class="status"></div><div class="source-list">'+files+'</div></div><div class="stats"><div class="card"><div class="eyebrow">SOURCES</div><div class="num">'+state.sources.length+'</div><div class="muted">provided</div></div><div class="card"><div class="eyebrow">CAREER RECORD</div><div class="num">'+state.rows.length+'</div><div class="muted">signals structured</div></div><div class="card"><div class="eyebrow">SKILLS</div><div class="num">'+(state.skills.hard.length+state.skills.soft.length)+'</div><div class="muted">signals detected</div></div><div class="card"><div class="eyebrow">EVIDENCE</div><div class="num">'+Math.round(state.raw.length/1000)+'</div><div class="muted">k characters read</div></div></div><div class="note"><strong>The parsing is evidence-first.</strong> It does not decide your future. It surfaces what your work actually says about you.</div><div class="section-head"><div><div class="eyebrow">PARSED CAREER RECORD</div><h3>This is what the lab found.</h3></div><span class="muted">Structured from your evidence.</span></div>'+parsedTable()+'')}
function parsedTable(){if(!state.rows.length)return '<div class="table-wrap"><div class="note">The parser has not found enough structured career moments yet. Add a CV, case study or portfolio export with dates and role/company context.</div></div>';return '<div class="table-wrap"><table class="data-table"><thead><tr><th>Period</th><th>Company / org</th><th>Role signal</th><th>Application type</th><th>Industry</th><th>Evidence</th><th>Source</th></tr></thead><tbody>'+state.rows.map(r=>'<tr><td>'+esc(r.period||'Not detected')+'</td><td>'+esc(r.company)+'</td><td>'+esc(r.role)+'</td><td><span class="tag saff">'+esc(r.type)+'</span></td><td><span class="tag teal">'+esc(r.industry)+'</span></td><td>'+esc(r.evidence)+'</td><td><span class="tag indigo">'+esc(r.source)+'</span></td></tr>').join('')+'</tbody></table></div>'}
async function addUrl(){let u=document.getElementById('urlInput')?.value.trim();if(!u)return;setStatus('Opening the portfolio and reading its visible content...');try{let r=await fetch('https://r.jina.ai/'+u);if(!r.ok)throw Error('fetch');let text=await r.text();ingest({name:u.replace(/^https?:\/\//,''),type:'Portfolio link',text,ok:true})}catch(e){state.sources.push({name:u,type:'Portfolio link',chars:0,ok:false});setStatus('This portfolio could not be read automatically. Keep the link as a source and continue with a file export of the portfolio.')}save();draw()}
async function handleFiles(list){for(const f of list){setStatus('Parsing <strong>'+esc(f.name)+'</strong>...');try{let r=await parseFile(f);ingest({name:f.name,type:r.type,text:r.text,ok:true})}catch(e){state.sources.push({name:f.name,type:f.type,chars:0,ok:false});setStatus('Could not parse '+esc(f.name)+'. The source is retained.')}}save();draw()}
async function parseFile(f){let n=f.name.toLowerCase();if(f.type.startsWith('image/')||/\.(png|jpg|jpeg|webp|gif|bmp|tiff)$/i.test(n)){let r=await Tesseract.recognize(f,'eng',{logger:m=>{if(m.status==='recognizing text')setStatus('Reading image... '+Math.round((m.progress||0)*100)+'%')}});return{type:'Image / OCR',text:r.data.text}}if(n.endsWith('.pdf')){let p=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise,o=[];for(let i=1;i<=p.numPages;i++){let q=await p.getPage(i),c=await q.getTextContent();o.push(c.items.map(x=>x.str).join(' '))}return{type:'PDF',text:o.join('\n')}}if(n.endsWith('.docx'))return{type:'DOCX',text:(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value};if(n.endsWith('.xlsx')||n.endsWith('.xls')){let w=XLSX.read(await f.arrayBuffer(),{type:'array'}),o=[];for(let s of w.SheetNames)o.push('SHEET: '+s+'\n'+XLSX.utils.sheet_to_csv(w.Sheets[s]));return{type:'Spreadsheet',text:o.join('\n')}}if(n.endsWith('.pptx')){let w=XLSX.read(await f.arrayBuffer(),{type:'array'});return{type:'PPTX',text:JSON.stringify(w.Sheets||{})}}return{type:'Text',text:await f.text()}}
function ingest(s){state.sources.push({name:s.name,type:s.type,chars:s.text.length,ok:true});state.raw+=(state.raw?'\n\n':'')+'===== '+s.name+' =====\n'+s.text;extract(s.text,s.name)}
function detectSkill(text){let low=text.toLowerCase(),map={hard:{'Interaction design':['interaction design','ux design','interaction designer'],'Research':['user research','usability','user testing','interviews','research'],'Prototyping':['prototype','prototyping','wireframe'],'Design systems':['design system','component library','tokens'],'Visual design':['visual design','visual designer','visual identity'],'Product strategy':['product strategy','product vision','roadmap','product thinking'],'Service design':['service design','service blueprint'],'AI interaction design':['generative ai','artificial intelligence','conversational','copilot','agentic','machine learning'],'Information architecture':['information architecture'],'Accessibility':['accessibility','wcag'],'Content design':['content design','content strategy'],'Motion design':['motion design','animation','micro-interaction'],'Data visualisation':['data visualization','data visualisation','dashboard']},soft:{'Strategic thinking':['strategic','strategy'],'Facilitation':['facilitat','workshop','co-creation'],'Storytelling':['storytell','narrative','presentation'],'Leadership':['led','lead','managed','management','mentor'],'Collaboration':['collaborat','cross-functional','partnered'],'Communication':['communicat','presented'],'Mentoring':['mentor','coaching'],'Stakeholder management':['stakeholder','executive'],'Systems thinking':['systems thinking'],'Judgement':['judgement','judgment','decision-making'],'Negotiation':['negotiat']}};return map}
function extract(text,source){let m=detectSkill(text);for(let type of ['hard','soft'])for(let [skill,terms] of Object.entries(m[type]))if(terms.some(t=>text.toLowerCase().includes(t))&&!state.skills[type].includes(skill))state.skills[type].push(skill);let lines=text.split(/\n+/).map(x=>x.replace(/\s+/g,' ').trim()).filter(x=>x.length>18);let date=/((19|20)\d{2})\s*(?:-|–|to)\s*((19|20)\d{2}|present|current)/i;let roles=/\b(designer|design|ux|product|research|manager|lead|director|consultant|architect|engineer|founder|head|strategist)\b/i;let companyish=/\b(?:at|@|with)\s+([A-Z][A-Za-z0-9& ._-]{2,50})/;for(let line of lines){if(state.rows.length>=40)break;let d=line.match(date),c=line.match(companyish),r=line.match(roles);if(d||c||r){let period=d?d[0]:'';let role=r?line.match(new RegExp('.{0,35}'+r[0]+'.{0,35}','i'))?.[0]||'':'';let company=c?c[1].trim():'';let type=/b2b|enterprise|saas|internal|platform/i.test(line)?'B2B / Enterprise':/b2c|consumer|retail|customer/i.test(line)?'B2C / Consumer':'Product / Digital';let industry=/finance|bank|fintech/i.test(line)?'Financial services':/health|hospital|medical/i.test(line)?'Healthcare':/retail|commerce|ecommerce/i.test(line)?'Retail / Commerce':/manufact|industrial/i.test(line)?'Manufacturing':/education|learning|school/i.test(line)?'Education':'Technology / Services';if((d||c)&&!state.rows.some(x=>x.evidence===line.slice(0,180)))state.rows.push({period,company:company||'Detected from evidence',role:role||'Role signal',type,industry,evidence:line.slice(0,180),source})}}}
function status(m){setStatus(m)}function setStatus(m){let x=document.getElementById('status');if(x)x.innerHTML=m}
function dashboard(){let skills=[...state.skills.hard.map(x=>[x,'hard']),...state.skills.soft.map(x=>[x,'soft'])];let viz=state.viz==='skills'?sunburst(skills):state.viz==='type'?distribution('Application / work type',state.rows.map(x=>x.type)):state.viz==='industry'?distribution('Industry distribution',state.rows.map(x=>x.industry)):timeline();return shell('02 · CAREER DASHBOARD','See the pattern before you judge it.','Your parsed evidence, turned into a career dashboard. Explore it, challenge it, then move on.','<div class="stats"><div class="card"><div class="eyebrow">CAREER SPAN</div><div class="num">'+careerSpan()+'</div><div class="muted">years detected</div></div><div class="card"><div class="eyebrow">PROJECT SIGNALS</div><div class="num">'+state.rows.length+'</div><div class="muted">career moments</div></div><div class="card"><div class="eyebrow">HARD SKILLS</div><div class="num">'+state.skills.hard.length+'</div><div class="muted">evidence-backed</div></div><div class="card"><div class="eyebrow">SOFT SKILLS</div><div class="num">'+state.skills.soft.length+'</div><div class="muted">evidence-backed</div></div></div><div class="section-head"><div><div class="eyebrow">EXPLORE</div><h3>Ask the dashboard a different question.</h3></div></div><div class="dashboard"><div class="card"><div class="vizbar"><button class="'+(state.viz==='skills'?'on':'')+'" onclick="viz('skills')">Generate my skill sunburst</button><button class="'+(state.viz==='type'?'on':'')+'" onclick="viz('type')">Work by application type</button><button class="'+(state.viz==='industry'?'on':'')+'" onclick="viz('industry')">Work by industry</button><button class="'+(state.viz==='timeline'?'on':'')+'" onclick="viz('timeline')">Career timeline</button></div><div class="chart">'+viz+'</div></div><div class="card"><div class="eyebrow">CAREER ROAD</div><div class="timeline">'+roadHtml()+'</div><div class="note">This is a first-pass machine reading. Your judgement is the correction layer.</div></div></div>')}
function careerSpan(){let ys=[];state.rows.forEach(r=>{let a=r.period.match(/(19|20)\d{2}/g);if(a)ys.push(...a.map(Number))});return ys.length?Math.max(1,Math.max(...ys)-Math.min(...ys)):0}
function viz(v){state.viz=v;save();draw()}
function sunburst(items){if(!items.length)return '<div class="muted">No skill signals yet.</div>';let hard=items.filter(x=>x[1]==='hard'),soft=items.filter(x=>x[1]==='soft'),cx=210,cy=160,r1=65,r2=145,total=items.length,svg='<svg viewBox="0 0 420 320" role="img"><circle cx="'+cx+'" cy="'+cy+'" r="'+r1+'" fill="#f0eadf"/><text x="'+cx+'" y="'+cy-3+'" text-anchor="middle" font-family="Georgia" font-size="18">Your</text><text x="'+cx+'" y="'+cy+20+'" text-anchor="middle" font-family="Georgia" font-size="18">skills</text>';let a=-Math.PI/2;items.forEach((it,i)=>{let ang=Math.PI*2/total*.94, x1=cx+r1*Math.cos(a),y1=cy+r1*Math.sin(a),x2=cx+r2*Math.cos(a),y2=cy+r2*Math.sin(a),x3=cx+r2*Math.cos(a+ang),y3=cy+r2*Math.sin(a+ang),x4=cx+r1*Math.cos(a+ang),y4=cy+r1*Math.sin(a+ang),large=ang>Math.PI?1:0,fill=it[1]==='hard'?['#d77932','#b89550','#357b76','#58679b'][i%4]:['#ad687d','#39745c','#8a775b'][i%3];svg+='<path d="M '+x1+' '+y1+' L '+x2+' '+y2+' A '+r2+' '+r2+' 0 '+large+' 1 '+x3+' '+y3+' L '+x4+' '+y4+' A '+r1+' '+r1+' 0 '+large+' 0 '+x1+' '+y1+'" fill="'+fill+'" opacity=".86"/>';let tx=cx+(r1+r2)/2*Math.cos(a+ang/2),ty=cy+(r1+r2)/2*Math.sin(a+ang/2);if(ang>.42)svg+='<text x="'+tx+'" y="'+ty+'" text-anchor="middle" font-size="9" fill="#fff">'+esc(it[0].slice(0,18))+'</text>';a+=Math.PI*2/total});svg+='</svg>';return svg}
function distribution(title,arr){let c={};arr.forEach(x=>c[x]=(c[x]||0)+1);let vals=Object.entries(c);if(!vals.length)return '<div class="muted">Not enough structured evidence yet.</div>';let max=Math.max(...vals.map(x=>x[1]));return '<div style="width:100%;padding:20px"><h3>'+title+'</h3>'+vals.map((x,i)=>'<div class="signal"><span>'+esc(x[0])+'</span><div class="bar"><i style="width:'+(x[1]/max*100)+'%"></i></div><b>'+x[1]+'</b></div>').join('')+'</div>'}
function timeline(){return '<div style="width:100%"><h3>Career timeline</h3>'+state.rows.slice(0,12).map((r,i)=>'<div class="signal"><span>'+esc(r.period||'Undated')+'</span><div><b>'+esc(r.role)+'</b><div class="muted">'+esc(r.company)+'</div></div><b>'+(i+1)+'</b></div>').join('')+'</div>'}
function roadHtml(){let labels=['Early career','Build','Expand','Now','Next','Lead','Beyond'];return '<div class="milestones">'+labels.map((x,i)=>'<div class="milestone"><div class="dotx" style="background:'+['#d77932','#b89550','#357b76','#58679b','#ad687d','#39745c','#8a775b'][i]+'"></div><b>'+x+'</b><small>'+(i<4?(state.rows[i]?.role||'Evidence pattern'):'Recommended direction')+'</small></div>').join('')+'</div>'}
function toggleSkill(type,x){let a=state.skills[type],i=a.indexOf(x);if(i>=0){if(state.skills[type].filter(s=>s.startsWith('!')).length<0)a.splice(i,1)}else a.push(x);save();draw()}
function strength(){let hard=state.skills.hard.length?state.skills.hard:hardCatalog.slice(0,6),soft=state.skills.soft.length?state.skills.soft:softCatalog.slice(0,6);return shell('03 · STRENGTHS','What are you actually good at?','The lab recommends skills from your evidence. You can add or remove them, but the strongest evidence-backed recommendations need reconfirmation before they disappear.','<div class="rec"><strong>Evidence lock:</strong> The top recommended skills are derived from repeated signals in your source material. To remove one, confirm that the evidence does not represent a real strength.</div><div class="strength-grid"><div class="card"><div class="eyebrow">HARD SKILLS</div><h3>What you can do</h3>'+skillEditor('hard',hard)+'</div><div class="card"><div class="eyebrow">SOFT SKILLS</div><h3>How you create value</h3>'+skillEditor('soft',soft)+'</div></div>')}
function skillEditor(type,list){
  let rows=list.map((x,i)=>{
    let key=type+'|'+x;
    let v=state.strength[key]||Math.max(55,88-i*5);
    let rec=i<Math.min(3,list.length);
    let safeKey=key.replace(/'/g,"\\'");
    let safeX=x.replace(/'/g,"\\'");
    return '<div class="strength-row"><span>'+esc(x)+(rec?' <span title="evidence-backed">•</span>':'')+'</span><input type="range" min="1" max="100" value="'+v+'" oninput="setStrength(\\''+safeKey+'\\',this.value)"><b>'+v+'</b><button class="back" title="Remove" onclick="removeSkill(\\''+type+'\\',\\''+safeX+'\\','+rec+')">×</button></div>';
  }).join('');
  let catalog=(type==='hard'?hardCatalog:softCatalog).filter(x=>!list.includes(x)).slice(0,7).map(x=>{
    let safe=x.replace(/'/g,"\\'");
    return '<button class="capsule" onclick="addSkill(\\''+type+'\\',\\''+safe+'\\')">+ '+x+'</button>';
  }).join('');
  return rows+'<div class="capsules">'+catalog+'</div>';
}
function setStrength(k,v){state.strength[k]=+v;save();event.target.parentElement.querySelector('b').textContent=v}
function addSkill(t,x){if(!state.skills[t].includes(x))state.skills[t].push(x);save();draw()}
function removeSkill(t,x,locked){if(locked&&!confirm('This skill was strongly supported by your evidence. Remove it anyway?'))return;state.skills[t]=state.skills[t].filter(s=>s!==x);delete state.strength[t+'|'+x];save();draw()}
function preferences(){let selected=Object.entries(state.interests).filter(([k,v])=>v.selected).map(x=>x[0]);return shell('04 · PREFERENCES','Five things you would choose even without applause.','Choose exactly five preference capsules. Then test each one for pull, energy, depth, persistence and experimentation.','<div class="capsules">'+pursuits.map(x=>'<button class="capsule '+(state.interests[x]?.selected?'sel':'')+'" onclick="pickInterest(\''+x.replace(/'/g,"\\'")+'\')">'+x+'</button>').join('')+'</div><div class="muted">Selected: '+selected.length+' / 5</div><div class="two">'+selected.map(x=>interestCard(x)).join('')+'</div><div class="card" style="margin-top:16px"><div class="eyebrow">PREFERENCES RADAR</div><h3>Your pattern of inclination</h3><div class="chart">'+interestRadar(selected)+'</div></div>')}
function pickInterest(x){state.interests[x]=state.interests[x]||{};let count=Object.values(state.interests).filter(v=>v.selected).length;if(state.interests[x].selected)state.interests[x].selected=false;else if(count<5)state.interests[x].selected=true;else return;save();draw()}
function interestCard(x){return '<div class="card"><h3>'+esc(x)+'</h3>'+['Pull','Energy','Depth','Persistence','Experimentation'].map(k=>'<div class="strength-row"><span>'+k+'</span><input type="range" min="1" max="5" value="'+(state.interests[x][k]||3)+'" oninput="setInterest(\''+x.replace(/'/g,"\\'")+'\',\''+k+'\',this.value)"><b>'+(state.interests[x][k]||3)+'</b></div>').join('')+'</div>'}
function setInterest(x,k,v){state.interests[x][k]=+v;save();event.target.parentElement.querySelector('b').textContent=v}
function interestRadar(selected){if(!selected.length)return '<div class="muted">Select five preferences to see your radar.</div>';let dims=['Pull','Energy','Depth','Persistence','Experimentation'],cx=250,cy=170,R=120,outer=[],inner=[];dims.forEach((d,i)=>{let a=-Math.PI/2+i*2*Math.PI/dims.length;outer.push((cx+R*Math.cos(a))+','+(cy+R*Math.sin(a)))});selected.forEach((x,i)=>{let s=state.interests[x],a=-Math.PI/2+i*2*Math.PI/selected.length,score=dims.reduce((q,d)=>q+(s[d]||3),0)/(dims.length*5),rr=R*(.35+score*.65);inner.push((cx+rr*Math.cos(a))+','+(cy+rr*Math.sin(a)))});return '<svg viewBox="0 0 500 340"><polygon points="'+outer.join(' ')+'" fill="#f0eadf" stroke="#cfc5b4"/><polygon points="'+inner.join(' ')+'" fill="#d7793238" stroke="#d77932" stroke-width="2"/>'+dims.map((d,i)=>{let a=-Math.PI/2+i*2*Math.PI/dims.length;return '<text x="'+(cx+(R+22)*Math.cos(a))+'" y="'+(cy+(R+22)*Math.sin(a))+'" text-anchor="middle" font-size="11">'+d+'</text>'}).join('')+'</svg>'}
function market(){return shell('05 · MARKET SIGNALS','Look outward.','This dimension is independent of the participant. It shows where the market is moving, then feeds into the later career recommendations.','<div class="market-grid"><div class="card"><div class="eyebrow">SKILL DEMAND · 2026 SNAPSHOT</div>'+marketSignals.map(x=>'<div class="signal"><span>'+x[0]+'</span><div><div class="bar"><i style="width:'+x[1]+'%"></i></div><div class="muted" style="font-size:10px;margin-top:5px">trend '+x[2].join(' → ')+'</div></div><b>'+x[1]+'</b></div>').join('')+'</div><div class="card"><div class="eyebrow">WHERE THE WORK IS MOVING</div><div class="chart">'+marketChart()+'</div><div class="note"><strong>Read this independently.</strong> Your market score is not a popularity contest. It is one dimension of the recommendation engine.</div><p class="muted" style="font-size:11px">Signal basis: global workforce research and current design/AI hiring patterns. Refresh the dataset when the workshop needs a new market snapshot.</p></div></div>')}
function marketChart(){let cats=['Startup','Product','Enterprise','Consulting','Services'],vals=[78,88,91,74,68];return '<svg viewBox="0 0 520 270"><line x1="50" y1="220" x2="490" y2="220" stroke="#d8cdbd"/>'+vals.map((v,i)=>{let x=70+i*100,h=v*1.7,y=220-h;return '<rect x="'+x+'" y="'+y+'" width="48" height="'+h+'" rx="8" fill="'+['#d77932','#b89550','#357b76','#58679b','#ad687d'][i]+'"/><text x="'+(x+24)+'" y="244" text-anchor="middle" font-size="10">'+cats[i]+'</text><text x="'+(x+24)+'" y="'+(y-7)+'" text-anchor="middle" font-size="11">'+v+'</text>'}).join('')+'</svg>'}
function careerMap(){let ranked=rankTerritories();return shell('06 · CAREER TEMPORAL MAP','Make the pattern useful.','Your report combines career evidence, strengths, genuine interests and market direction. It suggests territories, not a single destiny.','<div class="report"><div class="eyebrow">RECOMMENDED GROWTH TERRITORY</div><h2>'+esc(ranked[0].name)+'</h2><p>Opportunity signal · <strong style="color:#fff">'+ranked[0].score+'/100</strong></p><div class="road">'+['2015 → 2020','2020 → 2023','2023 → Now','Next 1–2 years','2–5 years','5–10 years','10–15 years'].map((x,i)=>'<div><b>'+x+'</b><small>'+esc(i<3?(state.rows[i]?.role||'Career evidence'):(i===3?'Recommended role territory':i===4?'Company type + scope':i===5?'Leadership / influence':'Long-horizon possibility'))+'</small></div>').join('')+'</div></div><div class="two"><div class="card"><div class="eyebrow">PERSONAL BRAND NARRATIVE</div><div class="field"><label>What should you become known for?</label><input value="'+esc(state.future.narrative||'')+'" oninput="setFuture(\'narrative\',this.value)"></div><div class="field"><label>Why should anyone believe it?</label><textarea oninput="setFuture(\'proof\',this.value)">'+esc(state.future.proof||'')+'</textarea></div><div class="note">Your narrative is the bridge between the evidence you have and the future you want to make visible.</div></div><div class="card"><div class="eyebrow">NEXT 4 WEEKS</div>'+['Choose one career experiment.','Build, learn or test it.','Create visible proof.','Reflect and recalibrate.'].map((x,i)=>'<div class="signal"><span>0'+(i+1)+'</span><b>'+x+'</b></div>').join('')+'</div></div><div class="card" style="margin-top:16px"><div class="eyebrow">PORTFOLIO RECIPE</div><div class="two">'+[['Spotlight','2–3 projects that prove the direction.'],['Character','Your recurring way of thinking and working.'],['Proof','Decisions, outcomes, constraints and evidence.'],['Distinctiveness','The combination that makes the portfolio recognisably yours.']].map(x=>'<div><h3>'+x[0]+'</h3><p class="muted">'+x[1]+'</p></div>').join('')+'</div></div><div class="card" style="margin-top:16px"><div class="eyebrow">GROWTH TERRITORIES</div>'+ranked.map((x,i)=>'<div class="signal"><span>0'+(i+1)+'</span><div><b>'+esc(x.name)+'</b><div class="bar"><i style="width:'+x.score+'%"></i></div></div><b>'+x.score+'</b></div>').join('')+'</div>')}
function setFuture(k,v){state.future[k]=v;save()}
function rankTerritories(){let interest=Object.values(state.interests).filter(x=>x.selected);let pull=interest.length?interest.reduce((s,x)=>s+(x.Pull||3),0)/(interest.length*5)*100:50;let strength=(Object.values(state.strength).reduce((a,b)=>a+b,0)/(Math.max(1,Object.values(state.strength).length)*100))*100;let evidence=Math.min(100,45+state.rows.length*4);return [['AI-native experience strategy',94],['Design systems leadership',82],['Research-led product strategy',86],['Experience strategy + facilitation',79],['Design education + practice',72]].map(x=>({name:x[0],score:Math.round(x[1]*.45+pull*.2+strength*.25+evidence*.1)})).sort((a,b)=>b.score-a.score)}
function resourceView(){let gaps=state.skills.hard.length<4?'Craft + Systems':'Strategy + AI fluency';return shell('07 · RECOMMENDED RESOURCES','What should you do next?','Resources are recommendations, not homework. Pick what closes the gap between your current evidence and your chosen direction.','<div class="card"><div class="eyebrow">YOUR RESOURCE MAP</div>'+resources.map(r=>'<div class="resource"><b>'+r[0]+'</b><div><strong>'+r[1]+'</strong><div class="muted">'+r[2]+'</div></div><button class="action secondary" onclick="alert(\'Resource recommendations for '+r[1]+' can be connected to the workshop resource library.\')">'+r[3]+'</button></div>').join('')+'</div><div class="note"><strong>Current gap signal:</strong> '+gaps+'. The strongest next step is the one that produces evidence, not just consumption.</div>')}
function feedback(){return shell('08 · FEEDBACK','One last thing.','Tell us whether this workshop actually helped you see your career differently.','<div class="card feedback"><div class="eyebrow">HOW USEFUL WAS THIS?</div><div class="stars">'+[1,2,3,4,5].map(i=>'<button class="'+(state.feedback.rating===i?'sel':'')+'" onclick="rate('+i+')">'+i+'</button>').join('')+'</div><div class="field"><label>What was most useful?</label><textarea placeholder="A moment, insight or feature that changed something for you..." oninput="state.feedback.note=this.value;save()">'+esc(state.feedback.note)+'</textarea></div><button class="action" onclick="submitFeedback()">Submit feedback</button></div><div class="note">You can print the complete Lakshya report from the header at any point. The printed version keeps the same evidence table, dashboard and career map.</div>')}
function rate(i){state.feedback.rating=i;save();draw()}
function submitFeedback(){alert('Thank you. Your feedback has been recorded for this session.')}
function draw(){nav();let html;if(state.step===0&&state.sources.length===0&&state.rows.length===0)html=home();else if(state.step===0)html=evidence();else if(state.step===1)html=dashboard();else if(state.step===2)html=strength();else if(state.step===3)html=preferences();else if(state.step===4)html=market();else if(state.step===5)html=careerMap();else if(state.step===6)html=resourceView();else html=feedback();document.getElementById('main').innerHTML=html;if(document.getElementById('fileInput'))document.getElementById('fileInput').addEventListener('change',e=>handleFiles([...e.target.files]));}
function exportExcel(){let wb=XLSX.utils.book_new();let sheets={CareerRecord:state.rows,HardSkills:state.skills.hard.map(x=>({skill:x,rating:state.strength['hard|'+x]||''})),SoftSkills:state.skills.soft.map(x=>({skill:x,rating:state.strength['soft|'+x]||''})),Interests:Object.entries(state.interests).filter(([k,v])=>v.selected).map(([k,v])=>({interest:k,...v})),Market:marketSignals.map(x=>({signal:x[0],score:x[1]})),CareerMap:rankTerritories().map((x,i)=>({rank:i+1,territory:x.name,score:x.score}))};Object.entries(sheets).forEach(([n,a])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(a),n));XLSX.writeFile(wb,'lakshya-report.xlsx')}
load();draw();
</script></body></html>
