<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Data Playground</title><style>body{margin:0;background:#f4f1eb;color:#191919;font-family:Inter,system-ui,sans-serif}.app{max-width:1050px;margin:auto;padding:30px 20px 60px}h1,h2{font-family:Georgia,serif}.top{display:flex;justify-content:space-between;align-items:end}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:800;color:#8b5d27}button,label{background:#191919;color:white;border:0;border-radius:999px;padding:11px 16px;font-weight:800;cursor:pointer}.tabs{display:flex;gap:5px;overflow:auto;margin:25px 0;border-bottom:1px solid #d8d1c8}.tabs button{background:none;color:#777;border-radius:0}.tabs .on{color:#111;border-bottom:2px solid #111}.panel,.card{background:white;border:1px solid #ded9d0;border-radius:20px;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.drop{border:2px dashed #c9c1b7;border-radius:18px;text-align:center;padding:35px;margin:20px 0}.drop input{display:none}.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #eee8df}.chip{display:inline-block;background:#eee9e1;border-radius:999px;padding:8px 11px;margin:4px;font-size:13px}.step{display:grid;grid-template-columns:140px 1fr;background:#f4f1eb;padding:16px;border-radius:12px;margin:8px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{display:block}.step{grid-template-columns:1fr;gap:5px}}</style></head><body><div class="app"><div class="top"><div><div class="eyebrow">PORTFOLIO CAREER LAB</div><h1>Beyond the Portfolio</h1><p>Turn career evidence into your next direction.</p></div><button onclick="download()">Export CSV</button></div><div class="tabs" id="tabs"></div><main id="main"></main></div><script>const T=['Career Data','Strengths','Interests','Market','Sweet Spot','Roadmap'];let t=0,files=[];let market=[['AI experience strategy',88,92,78],['Design systems leadership',82,74,91],['Research-led product strategy',76,80,86]];let hard=['Interaction design','Research','Prototyping','Design systems','AI interaction design'],soft=['Strategic thinking','Facilitation','Storytelling','Collaboration','Mentoring'];function draw(){tabs.innerHTML=T.map((x,i)=>'<button class='+(i===t?'on':'')+' onclick="t='+i+';draw()">'+x+'</button>').join('');let s='';if(t===0)s='<div class=panel><div class=eyebrow>PRE-WORK / ACTIVITY 1</div><h2>Career Data Playground</h2><p>Upload your career material and use the output as the basis for your clean dataset.</p><div class=drop><h3>Drop anything here</h3><p>Resume, PDF, text, spreadsheet, screenshots or audio.</p><input id=f type=file multiple onchange="files=[...this.files];draw()"><label for=f>Choose files</label></div><div class=grid><div class=card><h3>Sources</h3><p>'+ (files.length?files.map(x=>x.name).join('<br>'):'No files added yet')+'</p></div><div class=card><h3>Visualisation ideas</h3><p>Skills sunburst<br>Project timeline<br>Industry distribution<br>Project duration<br>Most repeated skills<br>Career transitions</p></div></div></div>';if(t===1)s='<div class=panel><div class=eyebrow>ACTIVITY 2</div><h2>Find Your Strengths</h2><div class=grid><div class=card><h3>Hard Skills</h3>'+hard.map((x,i)=>'<div class=row><span>'+x+'</span><b>'+(90-i*7)+'/100</b></div>').join('')+'</div><div class=card><h3>Soft Skills</h3>'+soft.map((x,i)=>'<div class=row><span>'+x+'</span><b>'+(88-i*6)+'/100</b></div>').join('')+'</div></div></div>';if(t===2)s='<div class=panel><div class=eyebrow>ACTIVITY 3</div><h2>Ruchi Radar</h2><p>Separate genuine interest from borrowed inspiration.</p>'+['Pull','Energy','Depth','Persistence','Experimentation'].map((x,i)=>'<div class=row><b>'+x+'</b><span>'+['Would you choose it without external validation?','Does doing it give energy back?','Have you gone beyond surface curiosity?','Do you keep returning to it?','Have you actually tried it?'][i]+'</span></div>').join('')+'</div>';if(t===3)s='<div class=panel><div class=eyebrow>ACTIVITY 4</div><h2>Disha Guardrail</h2><p>Fine-tune market signals.</p>'+market.map((x,i)=>'<div class=row><b>'+x[0]+'</b><input type=range min=0 max=100 value='+x[1]+' oninput="market['+i+'][1]=+this.value;draw()"><b>'+x[1]+'</b></div>').join('')+'</div>';if(t===4)s='<div class=panel><div class=eyebrow>ACTIVITY 5</div><h2>Growth Sweet Spot</h2>'+market.map((x,i)=>'<div class=row><b>#'+(i+1)+' '+x[0]+'</b><strong>'+Math.round(.4*x[1]+.25*78+.35*x[3])+'</strong></div>').join('')+'</div>';if(t===5)s='<div class=panel><div class=eyebrow>ACTIVITY 6</div><h2>Future Self Blueprint</h2>'+[['0-30 days','Explore one experiment'],['30-90 days','Build something meaningful'],['3-6 months','Create proof'],['6-12 months','Position yourself'],['12-24 months','Expand responsibility']].map(x=>'<div class=step><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')+'</div>';main.innerHTML=s}function download(){let rows=['Type,Name'];hard.forEach(x=>rows.push('Hard Skill,'+x));soft.forEach(x=>rows.push('Soft Skill,'+x));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));a.download='portfolio-career-dataset.csv';a.click()}draw()</script></body></html>
