<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--ink:#10100f;--paper:#f8f4ec;--card:#fffdf9;--muted:#756e65;--line:#ded7cb;--saffron:#db8139;--gold:#c9a45a;--teal:#3d827d;--indigo:#596aa7;--rose:#b76a82;--green:#317653;--red:#a8463d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,sans-serif}button,input,textarea,select{font:inherit}.app{max-width:1240px;margin:auto;padding:24px 24px 70px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;padding:8px 0 22px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--saffron)}h1,h2,h3{font-family:Georgia,serif;font-weight:400}h1{font-size:clamp(42px,5vw,68px);line-height:.95;margin:8px 0}h2{font-size:34px;margin:8px 0 10px}h3{font-size:24px;margin:0 0 8px}p{line-height:1.5}.muted{color:var(--muted)}.small{font-size:12px}.actions,.row,.nav{display:flex;gap:9px;align-items:center}.actions{justify-content:flex-end}button{border:0;border-radius:999px;padding:11px 16px;background:var(--ink);color:#fff;font-weight:800;cursor:pointer}button.secondary{background:#ebe5db;color:var(--ink)}button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.4;cursor:not-allowed}.journey{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:12px 0 28px;padding:5px;background:#ebe5da;border-radius:18px}.journey button{background:transparent;color:#746e66;border-radius:13px;padding:12px 8px;text-align:left}.journey button.on{background:#fffdf9;color:var(--ink);box-shadow:0 3px 16px #0000000d}.journey .num{font-size:10px;color:var(--saffron);font-weight:900;display:block}.journey .name{font-size:12px;font-weight:800;display:block;margin-top:4px}.journey .done .name:after{content:' ✓';color:var(--green)}.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 18px 55px #6b5c460d}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:stretch}.heroArt{border-radius:22px;min-height:270px;background:radial-gradient(circle at 50% 50%,#e0b96d 0 2%,transparent 2.5%),repeating-conic-gradient(from 0deg,#f4e6ca 0 8deg,#d98a46 8deg 9deg,#e9d9bb 9deg 18deg);display:grid;place-items:center;position:relative;overflow:hidden}.heroArt:after{content:'यात्रा';font:400 70px Georgia,serif;color:#fff8;position:absolute;transform:rotate(-8deg)}.callout{padding:17px 18px;border-radius:16px;background:#f2ede4;border-left:3px solid var(--saffron);margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{border:1px solid var(--line);border-radius:18px;padding:20px;background:#fffdf9}.drop{border:2px dashed #cfc6b8;border-radius:20px;padding:38px;text-align:center;background:#fbf8f2;margin:20px 0}.drop input{display:none}.drop label{display:inline-block;background:var(--ink);color:#fff;padding:11px 17px;border-radius:999px;font-weight:800;cursor:pointer}.status{padding:12px 14px;border-radius:12px;margin-top:14px;background:#f0ebe3}.success{background:#e7f3ec;color:var(--green)}.error{background:#f8e8e5;color:var(--red)}.source{padding:12px 0;border-bottom:1px solid #eee7dc}.badge{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.metric{font:400 38px Georgia,serif}.bar{height:9px;background:#ebe5db;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--saffron),var(--gold));border-radius:99px}.range{display:grid;grid-template-columns:150px 1fr 45px;gap:14px;align-items:center;padding:15px 0;border-bottom:1px solid #eee7dc}.range input{width:100%;accent-color:var(--saffron)}.field{display:grid;gap:7px;margin:14px 0}.field label{background:none;color:var(--ink);padding:0;border-radius:0;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff}.field textarea{min-height:100px;resize:vertical}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid var(--line);background:#f4efe6;border-radius:999px;padding:8px 11px;font-size:12px}.scoreGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.score{border:1px solid var(--line);border-radius:15px;padding:14px;text-align:center}.score b{display:block;font:400 26px Georgia,serif;margin-bottom:4px}.rank{display:grid;grid-template-columns:44px 1fr 70px;gap:14px;align-items:center;padding:17px 0;border-bottom:1px solid #eee7dc}.rankNum{font:400 28px Georgia,serif;color:var(--saffron)}.steps{display:grid;gap:10px}.step{display:grid;grid-template-columns:115px 1fr;gap:15px;padding:16px;border-radius:14px;background:#f3eee5}.step b{font:400 21px Georgia,serif}.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-top:2px solid var(--ink);margin:25px 0}.time{padding:17px 12px;border-left:1px solid var(--line);min-height:120px}.time b{font:400 22px Georgia,serif}.time span{display:block;color:var(--muted);font-size:12px;margin-top:7px}.footerNav{display:flex;justify-content:space-between;gap:12px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}.tag{display:inline-flex;padding:6px 9px;border-radius:999px;background:#eee8de;font-size:11px;font-weight:800}.reportHero{padding:28px;border-radius:20px;background:linear-gradient(135deg,#151514,#29241d);color:#fff}.reportHero h2{font-size:42px}.reportHero .muted{color:#c6beb4}.accent{color:var(--saffron)}.empty{text-align:center;padding:30px;color:var(--muted)}pre{white-space:pre-wrap;max-height:280px;overflow:auto;background:#f5f1ea;padding:14px;border-radius:12px;font:12px/1.5 ui-monospace,monospace}@media(max-width:850px){.hero,.grid,.grid3{grid-template-columns:1fr}.journey{overflow:auto;grid-template-columns:repeat(6,minmax(135px,1fr))}.scoreGrid{grid-template-columns:repeat(2,1fr)}.range{grid-template-columns:110px 1fr 40px}.top{display:block}.actions{margin-top:15px;justify-content:flex-start}.timeline{overflow:auto;grid-template-columns:repeat(5,160px)}.step{grid-template-columns:1fr}}
</style>
</head>
<body><div class="app">
<header class="top"><div><div class="eyebrow">PORTFOLIO CAREER LAB · यात्रा</div><h1>Beyond the Portfolio</h1><p class="muted">A guided career lab. One activity at a time, from evidence to direction.</p></div><div class="actions"><button class="secondary" onclick="resetLab()">Reset</button><button onclick="exportExcel()">Export workbook</button></div></header>
<nav class="journey" id="journey"></nav><main id="main"></main>
</div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const STEPS=['Career Map','Play Around','Strengths','Interests','Market','Career Report'];
const skillLexicon={
'Interaction design':'interaction design|interaction designer|interaction patterns|ux design','User research':'user research|usability|research|interviews|user testing','Prototyping':'prototype|prototyping|wireframe|wireframing','Design systems':'design system|design systems|component library|tokens','Visual design':'visual design','Product strategy':'product strategy|product thinking|product vision|roadmap','Information architecture':'information architecture|\bia\b|navigation','Service design':'service design|service blueprint','AI interaction design':'generative ai|machine learning|conversational|copilot|ai','Facilitation':'facilitat|workshop|co-creation','Storytelling':'storytell|presentation|narrative','Leadership':'lead|managed|management|mentored|team','Collaboration':'collaborat|cross-functional','Strategy':'strategy|strategic','Communication':'communicat','Mentoring':'mentor|coaching','Stakeholder management':'stakeholder'};
const softNames=new Set(['Facilitation','Storytelling','Leadership','Collaboration','Strategy','Communication','Mentoring','Stakeholder management']);
const state={step:0,sources:[],projects:[],hard:[],soft:[],rawText:'',strengthRatings:{},interests:{},market:{'AI experience strategy':78,'Design systems leadership':68,'Research-led product strategy':62},profile:{name:'',future:'',proof:''}};
const defaultInterests=['AI / emerging technology','Design leadership','Research','Design systems','Product strategy','Education / mentoring','Entrepreneurship','Creative practice'];
const marketMeta={'AI experience strategy':[88,92,78],'Design systems leadership':[82,74,91],'Research-led product strategy':[76,80,86]};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem('beyondPortfolioLab',JSON.stringify(state))}
function load(){try{Object.assign(state,JSON.parse(localStorage.getItem('beyondPortfolioLab')||'{}'))}catch(e){}}
function renderJourney(){ $('journey').innerHTML=STEPS.map((x,i)=>'<button class="'+(i===state.step?'on ':'')+(i<state.step?'done':'')+'" onclick="go('+i+')"><span class="num">0'+(i+1)+'</span><span class="name">'+x+'</span></button>').join('') }
function go(i){if(i>state.step && !canLeave(state.step)){return}state.step=i;save();draw()}
function canLeave(i){if(i===0)return state.sources.length>0;if(i===3)return Object.keys(state.interests).filter(x=>state.interests[x].selected).length>=3;return true}
function next(){if(state.step<5){if(!canLeave(state.step)){alert('Finish this activity before moving on.');return}state.step++;save();draw()}else draw()}
function prev(){if(state.step>0){state.step--;save();draw()}}
function shell(eyebrow,title,intro,body,back=true,nextLabel='Continue'){return '<section class="panel"><div class="eyebrow">'+eyebrow+'</div><h2>'+title+'</h2><p class="muted">'+intro+'</p>'+body+(back||state.step<5?'<div class="footerNav">'+(back?'<button class="ghost" onclick="prev()">Back</button>':'<span></span>')+(state.step<5?'<button onclick="next()">'+nextLabel+' →</button>':'<button onclick="exportExcel()">Export your workbook</button>')+'</div>':'')+'</section>'}
function career(){let body='<div class="drop"><h3>Give the lab your career evidence.</h3><p>Upload your résumé, portfolio cases, project notes or other material. Files are read locally in your browser.</p><input id="files" type="file" multiple accept=".pdf,.docx,.txt,.md,.csv,.xlsx,.xls,.json"><label for="files">Choose files</label><div id="status"></div></div><div class="grid"><div class="card"><h3>Sources</h3>'+(state.sources.length?state.sources.map(x=>'<div class="source"><b>'+esc(x.name)+'</b><div class="small muted">'+x.type+' · '+x.chars.toLocaleString()+' characters</div><span class="badge" style="color:'+(x.ok?'var(--green)':'var(--red)')+'">'+(x.ok?'parsed':'needs attention')+'</span></div>').join(''):'<div class="empty">No material yet.</div>')+'</div><div class="card"><h3>The first read</h3><div class="row"><span>Projects found</span><b>'+state.projects.length+'</b></div><div class="row"><span>Hard skill signals</span><b>'+state.hard.length+'</b></div><div class="row"><span>Soft skill signals</span><b>'+state.soft.length+'</b></div><div class="row"><span>Text extracted</span><b>'+state.rawText.length.toLocaleString()+'</b></div></div></div>'+(state.rawText?'<div class="card" style="margin-top:16px"><h3>Evidence preview</h3><pre>'+esc(state.rawText.slice(0,9000))+'</pre></div>':'');return shell('01 / CAREER MAP','Build your Career Map','Start with the messy evidence. The lab turns it into a working dataset you can inspect and challenge.',body,false,'I have added my evidence')}
async function handleFiles(list){setStatus('Reading '+list.length+' file'+(list.length>1?'s':'')+'...');for(const file of list){try{const r=await parseFile(file);state.sources.push({name:file.name,type:r.type,chars:r.text.length,ok:true});state.rawText+=(state.rawText?'\n\n':'')+'===== '+file.name+' =====\n'+r.text;extractEvidence(r.text,file.name);setStatus('Parsed '+esc(file.name)+' successfully.','success')}catch(e){console.error(e);state.sources.push({name:file.name,type:file.type||'unknown',chars:0,ok:false});setStatus('Could not parse '+esc(file.name)+': '+esc(e.message||e),'error')}}save();draw()}
async function parseFile(file){const n=file.name.toLowerCase();if(n.endsWith('.pdf'))return parsePdf(file);if(n.endsWith('.docx'))return parseDocx(file);if(n.endsWith('.xlsx')||n.endsWith('.xls'))return parseXlsx(file);if(n.endsWith('.csv'))return {type:'CSV',text:await file.text()};if(n.endsWith('.json'))return {type:'JSON',text:JSON.stringify(JSON.parse(await file.text()),null,2)};return {type:'Text',text:await file.text()}}
async function parsePdf(file){const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,out=[];for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i),c=await p.getTextContent();out.push('--- Page '+i+' ---\n'+c.items.map(x=>x.str).join(' '))}return {type:'PDF',text:out.join('\n\n')}}
async function parseDocx(file){const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return {type:'DOCX',text:r.value}}
async function parseXlsx(file){const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}),out=[];for(const n of wb.SheetNames)out.push('--- Sheet: '+n+' ---\n'+XLSX.utils.sheet_to_csv(wb.Sheets[n]));return {type:'XLSX',text:out.join('\n\n')}}
function extractEvidence(text,source){const low=text.toLowerCase();for(const [name,rx] of Object.entries(skillLexicon)){if(new RegExp(rx,'i').test(low)){const target=softNames.has(name)?state.soft:state.hard;if(!target.includes(name))target.push(name)}}const lines=text.split(/\n|•|·/).map(x=>x.trim()).filter(x=>x.length>35),candidates=lines.filter(x=>/(project|case study|initiative|product|platform|experience|redesign|launched|led|built|designed|created|research)/i.test(x));for(const line of candidates.slice(0,12))if(!state.projects.some(p=>p.name===line.slice(0,100)))state.projects.push({name:line.slice(0,100),source})}
function play(){let surprises=[];if(state.projects.length)surprises.push('Your material contains '+state.projects.length+' project evidence points.');if(state.hard.length)surprises.push(state.hard.slice(0,3).join(', ')+' recur in your evidence.');if(state.soft.length)surprises.push(state.soft.slice(0,3).join(', ')+' show up as ways of working.');return shell('02 / PLAY AROUND','Play with your Career Map','Do not optimise yet. Explore what the system sees, then decide what feels true.', '<div class="grid"><div class="card"><h3>What the system sees</h3>'+(surprises.length?surprises.map(x=>'<div class="callout">'+esc(x)+'</div>').join(''):'<div class="empty">Upload evidence in Activity 1 first.</div>')+'</div><div class="card"><h3>Three prompts</h3><div class="callout"><b>Notice</b><br>What pattern did you not expect?</div><div class="callout"><b>Challenge</b><br>What interpretation feels wrong or incomplete?</div><div class="callout"><b>Name</b><br>What do you want to investigate further?</div></div></div>')}
function strengthRows(arr,type){return arr.map((x,i)=>{let v=state.strengthRatings[type+'|'+x]??(type==='hard'?Math.max(45,82-i*5):Math.max(45,84-i*5));return '<div class="range"><b>'+esc(x)+'</b><input type="range" min="1" max="100" value="'+v+'" oninput="setStrength(\''+type+'\',\''+esc(x).replace(/'/g,"\\'")+'\',this.value)"><b>'+v+'</b></div>'}).join('')}
function setStrength(type,name,v){state.strengthRatings[type+'|'+name]=+v;save();const e=event?.target?.parentElement?.querySelector('b:last-child');if(e)e.textContent=v}
function strengths(){let h=state.hard.length?state.hard:['Interaction design','Research','Prototyping','Design systems','AI interaction design'],s=state.soft.length?state.soft:['Strategic thinking','Facilitation','Storytelling','Collaboration','Mentoring'];return shell('03 / STRENGTHS','Find the strengths hiding in the evidence','Rate what is genuinely strong. “I have done it” is not the same as “I am good at it.”', '<div class="grid"><div class="card"><h3>Hard skills</h3><p class="small muted">What you can demonstrably do.</p>'+strengthRows(h,'hard')+'</div><div class="card"><h3>Soft skills</h3><p class="small muted">How you operate and create value.</p>'+strengthRows(s,'soft')+'</div></div><div class="callout"><b>Rule:</b> evidence matters. Confidence without evidence is not a strong signal.</div>')}
function interests(){return shell('04 / INTERESTS','Build your Ruchi Radar','Pick 3-5 pursuits that genuinely pull you. Then rate the signal.', '<div class="chips">'+defaultInterests.map(x=>'<button class="'+(state.interests[x]?.selected?'':'secondary')+'" onclick="toggleInterest(\''+x.replace(/'/g,"\\'")+'\')">'+x+'</button>').join('')+'</div>'+(Object.keys(state.interests).filter(x=>state.interests[x].selected).length?Object.keys(state.interests).filter(x=>state.interests[x].selected).map(x=>'<div class="card" style="margin-top:14px"><div class="row"><h3>'+esc(x)+'</h3><span class="tag">chosen</span></div>'+['Pull','Energy','Depth','Persistence','Experimentation'].map(k=>'<div class="range"><span>'+k+'</span><input type="range" min="1" max="5" value="'+(state.interests[x][k]||3)+'" oninput="setInterest(\''+x.replace(/'/g,"\\'")+'\',\''+k+'\',this.value)"><b>'+(state.interests[x][k]||3)+'</b></div>').join('')+'</div>').join(''):'<div class="empty">Choose at least 3 pursuits to continue.</div>'))}
function toggleInterest(x){state.interests[x]=state.interests[x]||{selected:false};state.interests[x].selected=!state.interests[x].selected;save();draw()}
function setInterest(x,k,v){state.interests[x]=state.interests[x]||{selected:true};state.interests[x][k]=+v;save();const e=event?.target?.parentElement?.querySelector('b:last-child');if(e)e.textContent=v}
function marketView(){return shell('05 / MARKET SIGNALS','Use the market as a guardrail','Demand can expand your options. It should not decide your identity.', '<div>'+Object.keys(state.market).map(x=>'<div class="range"><b>'+esc(x)+'</b><input type="range" min="0" max="100" value="'+state.market[x]+'" oninput="setMarket(\''+x.replace(/'/g,"\\'")+'\',this.value)"><b>'+state.market[x]+'</b></div>').join('')+'</div><div class="callout"><b>Better question:</b> Where does my evidence, genuine interest and capability meet a meaningful market signal?</div>')}
function setMarket(x,v){state.market[x]=+v;save();const e=event?.target?.parentElement?.querySelector('b:last-child');if(e)e.textContent=v}
function scoreInterest(){const selected=Object.keys(state.interests).filter(x=>state.interests[x].selected);if(!selected.length)return 50;return Math.round(selected.reduce((a,x)=>a+Object.values(state.interests[x]).filter(v=>typeof v==='number').reduce((q,v)=>q+v,0)/25,0)/selected.length*100)}
function strengthScore(){let vals=Object.values(state.strengthRatings);return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):65}
function opportunities(){let ss=strengthScore(),ii=scoreInterest();return Object.entries(state.market).map(([name,m])=>{let fit=name.includes('AI')&&state.hard.includes('AI interaction design')?90:name.includes('systems')&&state.hard.includes('Design systems')?88:74;let score=Math.round(.30*fit+.20*ss+.20*ii+.20*m+.10*70);return{name,score,fit,m}}).sort((a,b)=>b.score-a.score)}
function report(){const opp=opportunities(),selected=Object.keys(state.interests).filter(x=>state.interests[x].selected),top=opp[0],future=state.profile.future||'a more deliberate version of my current practice';return shell('06 / CAREER TEMPORAL MAP','Your Career Report','The goal is not a perfect job title. It is a set of credible directions and a next move.', '<div class="reportHero"><div class="eyebrow">YOUR GROWTH TERRITORY</div><h2>'+esc(top.name)+'</h2><p class="muted">Opportunity signal <strong style="color:#fff">'+top.score+'/100</strong>. This is a direction to test, not a verdict.</p></div><div class="grid" style="margin-top:16px"><div class="card"><h3>01 / Career Roadmap</h3><div class="timeline"><div class="time"><b>Past</b><span>'+state.projects.length+' evidence points</span></div><div class="time"><b>Patterns</b><span>'+state.hard.length+' hard · '+state.soft.length+' soft</span></div><div class="time"><b>Now</b><span>Current practice</span></div><div class="time"><b>Next</b><span>'+esc(top.name)+'</span></div><div class="time"><b>Beyond</b><span>Expand the proof</span></div></div></div><div class="card"><h3>02 / Personal Brand Narrative</h3><p><b>Today:</b> '+(state.profile.proof||'Your evidence-led design practice')+'</p><p><b>Becoming:</b> '+esc(future)+'</p></div></div><div class="grid" style="margin-top:16px"><div class="card"><h3>03 / Next 4 weeks</h3><div class="steps"><div class="step"><b>Week 01</b><span>Choose one experiment in '+esc(top.name)+'.</span></div><div class="step"><b>Week 02</b><span>Build, learn or test something concrete.</span></div><div class="step"><b>Week 03</b><span>Create visible proof and get one outside reaction.</span></div><div class="step"><b>Week 04</b><span>Reflect, decide and update your direction.</span></div></div></div><div class="card"><h3>04 / Portfolio Recipe</h3><div class="callout"><b>Spotlight</b><br>Choose 2-3 projects that prove the direction.</div><div class="callout"><b>Character</b><br>Make your recurring way of working visible.</div><div class="callout"><b>Proof</b><br>Show outcomes, decisions and evidence, not just screens.</div><div class="callout"><b>Distinctiveness</b><br>Make the portfolio recognisably yours.</div></div></div><div class="card" style="margin-top:16px"><h3>05 / Growth Sweet Spot</h3>'+opp.map((x,i)=>'<div class="rank"><span class="rankNum">0'+(i+1)+'</span><div><b>'+esc(x.name)+'</b><div class="bar" style="margin-top:7px"><i style="width:'+x.score+'%"></i></div></div><strong>'+x.score+'</strong></div>').join('')+'</div><div class="card" style="margin-top:16px"><h3>06 / Your reflection</h3><div class="field"><label>What do you want to become known for?</label><input id="futureField" value="" oninput="state.profile.future=this.value;save()"></div><div class="field"><label>What evidence already supports that direction?</label><textarea id="proofField" oninput="state.profile.proof=this.value;save()"></textarea></div><p><b>Three years from now, I hope I can say:</b></p><div class="callout">'+esc(future)+'</div></div>',true)}
function profile(){return ''}
function draw(){renderJourney();let html=state.step===0?career():state.step===1?play():state.step===2?strengths():state.step===3?interests():state.step===4?marketView():report();$('main').innerHTML=html;if($('files'))$('files').addEventListener('change',e=>handleFiles([...e.target.files]));}
function setStatus(msg,kind=''){const s=$('status');if(s)s.innerHTML='<div class="status '+kind+'">'+msg+'</div>'}
function resetLab(){if(confirm('Clear this participant\'s workshop data?')){localStorage.removeItem('beyondPortfolioLab');location.reload()}}
function exportExcel(){const wb=XLSX.utils.book_new();const sheets={Sources:state.sources,Projects:state.projects,HardSkills:state.hard.map(x=>({skill:x,score:state.strengthRatings['hard|'+x]||''})),SoftSkills:state.soft.map(x=>({skill:x,score:state.strengthRatings['soft|'+x]||''})),Interests:Object.entries(state.interests).filter(([k,v])=>v.selected).map(([k,v])=>({pursuit:k,...v})),Market:Object.entries(state.market).map(([k,v])=>({opportunity:k,demand:v})),Report:opportunities().map((x,i)=>({rank:i+1,territory:x.name,score:x.score}))};Object.entries(sheets).forEach(([n,a])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(a),n));XLSX.writeFile(wb,'beyond-the-portfolio-career-lab.xlsx')}
load();draw();
</script>
