<style>
:root{--ink:#11110f;--paper:#f5f0e6;--white:#fffdf8;--muted:#81796f;--line:#ded6c8;--saffron:#db8037;--gold:#c7a158;--teal:#43837e;--indigo:#5a68a0;--rose:#b76c82;--green:#347454}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif}.app{min-height:100vh}.top{height:72px;padding:0 34px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #0000000d;position:sticky;top:0;background:#f5f0e6eF;backdrop-filter:blur(16px);z-index:20}.brand{display:flex;align-items:center;gap:12px}.mark{width:31px;height:31px;border-radius:50%;background:repeating-conic-gradient(var(--saffron) 0 12deg,#f1d6ad 12deg 24deg);box-shadow:inset 0 0 0 6px var(--paper);}.brand strong{font:400 20px Georgia,serif}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.17em;text-transform:uppercase}.top button{border:0;background:none;color:#625b53;font-size:12px;cursor:pointer}.shell{max-width:1160px;margin:auto;padding:38px 28px 80px}.progress{display:flex;gap:5px;margin:4px 0 55px}.progress i{height:3px;flex:1;background:#ddd5c7;border-radius:9px;transition:.5s}.progress i.on{background:linear-gradient(90deg,var(--saffron),var(--gold))}.scene{animation:enter .6s cubic-bezier(.2,.8,.2,1)}@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--saffron);margin-bottom:18px}.hero{min-height:67vh;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:55px}.hero h1{font:400 clamp(58px,8vw,112px)/.84 Georgia,serif;letter-spacing:-.065em;margin:0}.hero h1 em{font-style:normal;color:var(--saffron)}.hero p{font:400 22px/1.4 Georgia,serif;color:#645d55;max-width:600px;margin:28px 0}.mandala{aspect-ratio:1;max-width:430px;margin:auto;border-radius:50%;background:repeating-conic-gradient(from 3deg,transparent 0 11deg,#d88a4730 11.5deg 12.5deg,transparent 13deg 24deg),radial-gradient(circle,#e3b96b 0 2%,transparent 2.5% 17%,#43837e25 17.5% 18%,transparent 18.5% 32%,#b76c8222 32.5% 33%,transparent 33.5% 48%,#d88a4720 48.5% 49%,transparent 49.5%);position:relative;animation:turn 35s linear infinite}.mandala:after{content:'रीयाज़';position:absolute;inset:0;display:grid;place-items:center;font:400 52px Georgia,serif;color:#a36b39}.mandala:before{content:'PRACTICE · PATTERN · POSSIBILITY';position:absolute;inset:10%;display:grid;place-items:end center;padding-bottom:30px;font-size:8px;letter-spacing:.18em;color:#8c7760}@keyframes turn{to{transform:rotate(360deg)}}h1,h2,h3{font-family:Georgia,serif;font-weight:400}h2{font-size:clamp(38px,5vw,62px);line-height:.95;letter-spacing:-.04em;margin:0 0 15px}h3{font-size:25px;margin:0 0 8px}.intro{color:var(--muted);font-size:15px;max-width:620px;line-height:1.55}.action{display:inline-flex;align-items:center;gap:9px;border:0;background:var(--ink);color:white;border-radius:999px;padding:13px 18px;font-weight:800;cursor:pointer}.action:disabled{opacity:.35;cursor:not-allowed}.ghost{background:#ebe4d8;color:var(--ink)}.back{border:0;background:none;color:var(--muted);cursor:pointer}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}.drop{border:1px dashed #c8bdac;border-radius:25px;padding:54px 25px;text-align:center;background:#fbf8f0;margin:30px 0}.drop input{display:none}.drop label{display:inline-block;background:var(--ink);color:white;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer}.status{margin-top:15px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:22px;position:relative;overflow:hidden}.card:after{content:'✦';position:absolute;right:15px;top:11px;color:#c7a15855;font-size:16px}.big{font:400 44px Georgia,serif}.muted{color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:25px 0}.chip{border:1px solid var(--line);background:var(--white);padding:11px 14px;border-radius:99px;cursor:pointer}.chip.selected{background:var(--ink);color:#fff;border-color:var(--ink)}.slider{padding:17px 0;border-bottom:1px solid #eee7dc;display:grid;grid-template-columns:180px 1fr 34px;gap:15px;align-items:center}.slider input{width:100%;accent-color:var(--saffron)}.slider b{font:400 20px Georgia,serif;text-align:right}.radar{height:360px;aspect-ratio:1;max-width:360px;border-radius:50%;margin:auto;background:repeating-radial-gradient(circle,#fffdf8 0 20%,#ebe2d3 20.5% 21%,#fffdf8 21.5% 40%,#ebe2d3 40.5% 41%,#fffdf8 41.5% 60%,#ebe2d3 60.5% 61%,#fffdf8 61.5%);position:relative;border:1px solid var(--line)}.radar:before,.radar:after{content:'';position:absolute;background:#cfc5b5}.radar:before{height:1px;left:0;right:0;top:50%}.radar:after{width:1px;top:0;bottom:0;left:50%}.dot{position:absolute;width:13px;height:13px;background:var(--saffron);border-radius:50%;box-shadow:0 0 0 7px #db803720}.d1{left:65%;top:22%}.d2{left:77%;top:49%}.d3{left:52%;top:74%}.d4{left:27%;top:56%}.d5{left:41%;top:34%}.quote{font:400 clamp(34px,5vw,64px)/1.02 Georgia,serif;letter-spacing:-.04em}.signal{display:grid;grid-template-columns:1fr 100px;gap:15px;align-items:center;padding:18px 0;border-bottom:1px solid #eee7dc}.signal .score{font:400 30px Georgia,serif;text-align:right}.bar{height:7px;background:#e8e0d3;border-radius:99px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--saffron),var(--gold));border-radius:99px}.report{background:#151514;color:#f7f1e7;border-radius:26px;padding:32px}.report .eyebrow{color:#e0a15e}.report h2{font-size:48px}.report p{color:#bfb6aa}.road{display:grid;grid-template-columns:repeat(5,1fr);border-top:2px solid #d8c09a;margin-top:24px}.road div{padding:18px 12px;border-left:1px solid #ffffff22;min-height:100px}.road b{font:400 22px Georgia,serif}.road span{display:block;font-size:11px;color:#aaa196;margin-top:8px}.steps{display:grid;gap:8px}.steps div{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:14px;background:#f3eee5;border-radius:12px}.rank{display:grid;grid-template-columns:35px 1fr 50px;gap:12px;align-items:center;padding:15px 0;border-bottom:1px solid #eee7dc}.rank strong{font:400 24px Georgia,serif;text-align:right}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.field input,.field textarea{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px}.field textarea{min-height:100px}.files{font-size:12px;color:var(--muted);margin-top:15px}.note{padding:16px 18px;background:#f0eadf;border-left:3px solid var(--saffron);border-radius:10px;margin:18px 0;line-height:1.5}.empty{padding:25px;text-align:center;color:var(--muted)}@media(max-width:800px){.hero,.grid2,.grid{grid-template-columns:1fr}.hero{padding-top:30px}.mandala{max-width:280px}.top{padding:0 18px}.shell{padding:28px 18px 60px}.slider{grid-template-columns:110px 1fr 30px}.road{overflow:auto;grid-template-columns:repeat(5,145px)}.road div{min-width:145px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><span class="mark"></span><div><strong>Career Riyaaz</strong><small>Beyond the Portfolio</small></div></div><div><button onclick="resetLab()">Reset</button> <button onclick="exportExcel()">Export</button></div></header>
<div class="shell"><div class="progress" id="progress"></div><main id="main"></main></div></div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const steps=['Career Map','Play','Strengths','Ruchi','Market','Your Map'];
const skills={'Interaction design':'interaction design|ux design|interaction designer','Research':'user research|usability|research|interviews|user testing','Prototyping':'prototype|prototyping|wireframe','Design systems':'design system|component library|tokens','Visual design':'visual design','Product strategy':'product strategy|product thinking|product vision|roadmap','Service design':'service design|service blueprint','AI interaction design':'generative ai|machine learning|conversational|copilot|artificial intelligence','Facilitation':'facilitat|workshop|co-creation','Storytelling':'storytell|presentation|narrative','Leadership':'lead|managed|management|mentored|team','Collaboration':'collaborat|cross-functional','Strategy':'strategy|strategic','Communication':'communicat','Mentoring':'mentor|coaching','Stakeholder management':'stakeholder'};
const soft=new Set(['Facilitation','Storytelling','Leadership','Collaboration','Strategy','Communication','Mentoring','Stakeholder management']);
const pursuits=['AI / emerging technology','Design leadership','Research','Design systems','Product strategy','Education / mentoring','Entrepreneurship','Creative practice'];
const state={step:0,sources:[],projects:[],hard:[],soft:[],rawText:'',strength:{},interests:{},market:{'AI experience strategy':78,'Design systems leadership':68,'Research-led product strategy':62},future:'',proof:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem('careerRiyaaz',JSON.stringify(state))}
function load(){try{Object.assign(state,JSON.parse(localStorage.getItem('careerRiyaaz')||'{}'))}catch(e){}}
function nav(){document.querySelectorAll('.progress i').forEach((x,i)=>x.className=i<=state.step?'on':'')}
function go(i){if(i>state.step&&!canNext()){alert('Finish this activity first.');return}state.step=i;save();draw()}
function canNext(){if(state.step===0)return state.sources.length>0;if(state.step===3)return Object.keys(state.interests).filter(x=>state.interests[x]?.selected).length>=3;return true}
function next(){if(canNext()){state.step=Math.min(5,state.step+1);save();draw()}else alert(state.step===0?'Add at least one career file to begin.':'Choose at least 3 genuine pursuits before continuing.')}
function shell(label,title,intro,body,buttons=true){return '<section class="scene">'+(label?'<div class="eyebrow">'+label+'</div>':'')+'<h2>'+title+'</h2><p class="intro">'+intro+'</p>'+body+(buttons?'<div class="bottom"><button class="back" onclick="go('+Math.max(0,state.step-1)+')">← Back</button>'+(state.step<5?'<button class="action" onclick="next()">Continue →</button>':'<button class="action" onclick="exportExcel()">Export my Career Riyaaz →</button>')+'</div>':'')+'</section>'}
function home(){return '<section class="hero scene"><div><div class="eyebrow">THE CAREER PRACTICE LAB</div><h1>Career<br><em>Riyaaz.</em></h1><p>Your career has patterns. Your next move is hidden somewhere inside them.</p><button class="action" onclick="next()">Begin the journey →</button><div class="note" style="max-width:510px">Six activities. Your evidence, your intuition, your choices. No perfect answers.</div></div><div class="mandala"></div></section>'}
function career(){let files=state.sources.map(x=>'<div class="files">✓ '+esc(x.name)+' · '+x.chars.toLocaleString()+' characters</div>').join('');return shell('01 · CAREER MAP','Let your work speak.','Give the lab a little evidence. It will find the patterns worth looking at.', '<div class="drop"><h3>Drop your career story here.</h3><p class="muted">Resume, portfolio, case studies, notes, spreadsheets.</p><input id="files" type="file" multiple accept=".pdf,.docx,.txt,.md,.csv,.xlsx,.xls,.json"><label for="files">Choose files</label><div id="status"></div>'+files+'</div><div class="grid"><div class="card"><div class="eyebrow">FOUND</div><div class="big">'+state.projects.length+'</div><div class="muted">project signals</div></div><div class="card"><div class="eyebrow">CAPABILITIES</div><div class="big">'+(state.hard.length+state.soft.length)+'</div><div class="muted">skill signals</div></div><div class="card"><div class="eyebrow">EVIDENCE</div><div class="big">'+state.rawText.length.toLocaleString()+'</div><div class="muted">characters read</div></div></div>',true)}
async function files(list){setStatus('Reading your work...');for(const f of list){try{let r=await parse(f);state.sources.push({name:f.name,type:r.type,chars:r.text.length,ok:true});state.rawText+=(state.rawText?'\n\n':'')+'===== '+f.name+' =====\n'+r.text;extract(r.text,f.name);setStatus('Read '+esc(f.name)+' successfully.','ok')}catch(e){state.sources.push({name:f.name,type:f.type,chars:0,ok:false});setStatus('Could not read '+esc(f.name)+'. Try another file.','error')}}save();draw()}
async function parse(f){let n=f.name.toLowerCase();if(n.endsWith('.pdf')){let p=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise,o=[];for(let i=1;i<=p.numPages;i++){let q=await p.getPage(i),c=await q.getTextContent();o.push(c.items.map(x=>x.str).join(' '))}return{type:'PDF',text:o.join('\n')}}if(n.endsWith('.docx'))return{type:'DOCX',text:(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value};if(n.endsWith('.xlsx')||n.endsWith('.xls')){let w=XLSX.read(await f.arrayBuffer(),{type:'array'}),o=[];for(let s of w.SheetNames)o.push(XLSX.utils.sheet_to_csv(w.Sheets[s]));return{type:'XLSX',text:o.join('\n')}}if(n.endsWith('.json'))return{type:'JSON',text:JSON.stringify(JSON.parse(await f.text()),null,2)};return{type:'Text',text:await f.text()}}
function extract(text,source){let low=text.toLowerCase();for(let [n,r] of Object.entries(skills))if(new RegExp(r,'i').test(low)){let a=soft.has(n)?state.soft:state.hard;if(!a.includes(n))a.push(n)}let lines=text.split(/\n|•|·/).map(x=>x.trim()).filter(x=>x.length>35);for(let x of lines.filter(x=>/(project|case study|initiative|product|platform|redesign|launched|led|built|designed|created)/i.test(x)).slice(0,12))if(!state.projects.some(p=>p.name===x.slice(0,100)))state.projects.push({name:x.slice(0,100),source})}
function play(){let a=[];if(state.projects.length)a.push(state.projects.length+' project patterns found.');if(state.hard.length)a.push('Recurring hard signals: '+state.hard.slice(0,4).join(', ')+'.');if(state.soft.length)a.push('Ways of working: '+state.soft.slice(0,4).join(', ')+'.');return shell('02 · PLAY','Look. Notice. Question.','Take one minute. Do not fix anything yet.', '<div class="grid3">'+['<div class="card"><div class="eyebrow">LOOK</div><h3>'+a.length+' signals</h3><p class="muted">'+(a.join(' ')||'Your evidence is waiting to be explored.')+'</p></div>','<div class="card"><div class="eyebrow">NOTICE</div><h3>What surprised you?</h3><p class="muted">Find one pattern you did not expect.</p></div>','<div class="card"><div class="eyebrow">QUESTION</div><h3>What feels wrong?</h3><p class="muted">The system can be wrong. Your disagreement is useful.</p></div>'].join('')+'</div>')}
function setStrength(k,v){state.strength[k]=+v;save();let e=event.target.parentElement.querySelector('b:last-child');e.textContent=v}
function strengths(){let h=state.hard.length?state.hard:['Interaction design','Research','Prototyping','Design systems','AI interaction design'],s=state.soft.length?state.soft:['Strategic thinking','Facilitation','Storytelling','Collaboration','Mentoring'];let rows=(a,t)=>a.map((x,i)=>'<div class="slider"><span>'+esc(x)+'</span><input type="range" min="1" max="100" value="'+(state.strength[t+'|'+x]||Math.max(50,84-i*6))+'" oninput="setStrength(\''+t+'|'+x.replace(/'/g,"\\'")+'\',this.value)"><b>'+(state.strength[t+'|'+x]||Math.max(50,84-i*6))+'</b></div>').join('');return shell('03 · STRENGTHS','What are you actually good at?','Rate the evidence, not the ego.', '<div class="grid2"><div class="card"><div class="eyebrow">HARD</div><h3>What you can do</h3>'+rows(h,'hard')+'</div><div class="card"><div class="eyebrow">SOFT</div><h3>How you create value</h3>'+rows(s,'soft')+'</div></div><div class="note">A thing you have done is evidence. A strength is a pattern you can repeat.</div>')}
function toggle(x){state.interests[x]=state.interests[x]||{};state.interests[x].selected=!state.interests[x].selected;save();draw()}
function setInterest(x,k,v){state.interests[x][k]=+v;save();event.target.parentElement.querySelector('b:last-child').textContent=v}
function interests(){let selected=Object.keys(state.interests).filter(x=>state.interests[x].selected);let cards=selected.map(x=>'<div class="card"><h3>'+esc(x)+'</h3>'+['Pull','Energy','Depth','Persistence','Experimentation'].map(k=>'<div class="slider"><span>'+k+'</span><input type="range" min="1" max="5" value="'+(state.interests[x][k]||3)+'" oninput="setInterest(\''+x.replace(/'/g,"\\'")+'\',\''+k+'\',this.value)"><b>'+(state.interests[x][k]||3)+'</b></div>').join('')+'</div>').join('');return shell('04 · RUCHI RADAR','What keeps pulling you back?','Choose 3-5 things you would explore even if nobody applauded.', '<div class="chips">'+pursuits.map(x=>'<button class="chip '+(state.interests[x]?.selected?'selected':'')+'" onclick="toggle(\''+x+'\')">'+x+'</button>').join('')+'</div><div class="grid2">'+(cards||'<div class="empty">Choose your pursuits above.</div>')+'</div><div class="note">Ruchi means inclination or taste. This is about genuine pull, not borrowed ambition.</div>')}
function setMarket(x,v){state.market[x]=+v;save();event.target.parentElement.querySelector('b:last-child').textContent=v}
function market(){return shell('05 · MARKET SIGNALS','Look outward.','Use the market as a guardrail, not a GPS.', '<div class="grid2"><div class="card">'+Object.entries(state.market).map(([x,v])=>'<div class="slider"><span>'+x+'</span><input type="range" min="0" max="100" value="'+v+'" oninput="setMarket(\''+x+'\',this.value)"><b>'+v+'</b></div>').join('')+'</div><div class="card"><div class="eyebrow">THE RULE</div><div class="quote">Demand can open a door.<br><span class="accent">It cannot choose the room.</span></div><p class="muted">Your direction should still survive the test of evidence and genuine interest.</p></div></div>')}
function strengthScore(){let v=Object.values(state.strength);return v.length?Object.values(state.strength).reduce((a,b)=>a+b,0)/v.length:65}
function interestScore(){let a=Object.keys(state.interests).filter(x=>state.interests[x].selected);if(!a.length)return 50;return a.reduce((s,x)=>s+['Pull','Energy','Depth','Persistence','Experimentation'].reduce((q,k)=>q+(state.interests[x][k]||3),0)/25,0)/a.length*100}
function opportunities(){let ss=strengthScore(),ii=interestScore();return Object.entries(state.market).map(([n,m])=>{let fit=n.includes('AI')&&state.hard.includes('AI interaction design')?90:n.includes('systems')&&state.hard.includes('Design systems')?88:74;return{name:n,score:Math.round(.3*fit+.2*ss+.2*ii+.2*m+.1*70)}}).sort((a,b)=>b.score-a.score)}
function report(){let o=opportunities(),top=o[0];return shell('06 · YOUR CAREER MAP','Now make the pattern useful.','This is not a prediction. It is a direction worth testing.', '<div class="report"><div class="eyebrow">YOUR GROWTH TERRITORY</div><h2>'+top.name+'</h2><p>Opportunity signal · <strong style="color:#fff">'+top.score+'/100</strong></p><div class="road"><div><b>Past</b><span>'+state.projects.length+' project signals</span></div><div><b>Patterns</b><span>'+state.hard.length+' hard · '+state.soft.length+' soft</span></div><div><b>Now</b><span>Your current practice</span></div><div><b>Next</b><span>Test the territory</span></div><div><b>Beyond</b><span>Build the proof</span></div></div></div><div class="grid2" style="margin-top:18px"><div class="card"><div class="eyebrow">YOUR NARRATIVE</div><div class="field"><label>What do you want to become known for?</label><input value="'+esc(state.future)+'" oninput="state.future=this.value;save()"></div><div class="field"><label>What evidence supports it?</label><textarea oninput="state.proof=this.value;save()">'+esc(state.proof)+'</textarea></div></div><div class="card"><div class="eyebrow">NEXT 4 WEEKS</div><div class="steps"><div><b>01</b><span>Choose one experiment.</span></div><div><b>02</b><span>Build, learn or test.</span></div><div><b>03</b><span>Create visible proof.</span></div><div><b>04</b><span>Reflect and recalibrate.</span></div></div></div></div><div class="card" style="margin-top:18px"><div class="eyebrow">GROWTH SWEET SPOT</div>'+o.map((x,i)=>'<div class="rank"><span>0'+(i+1)+'</span><div><b>'+x.name+'</b><div class="bar"><i style="width:'+x.score+'%"></i></div></div><strong>'+x.score+'</strong></div>').join('')+'</div><div class="card" style="margin-top:18px"><div class="eyebrow">PORTFOLIO RECIPE</div><div class="grid"><div><h3>Spotlight</h3><p class="muted">Choose 2-3 projects that prove the direction.</p></div><div><h3>Character</h3><p class="muted">Make your recurring way of working visible.</p></div><div><h3>Proof</h3><p class="muted">Show decisions, outcomes and evidence.</p></div><div><h3>Distinctiveness</h3><p class="muted">Make the portfolio recognisably yours.</p></div></div></div><div class="note"><b>Three years from now:</b> '+esc(state.future||'write the sentence you want your future self to have earned.')+'</div>')}
function draw(){let html=state.step===0&&state.sources.length===0?home():state.step===0?career():state.step===1?play():state.step===2?strengths():state.step===3?interests():state.step===4?market():report();document.getElementById('main').innerHTML=html;document.getElementById('progress').innerHTML=steps.map((_,i)=>'<i class="'+(i<=state.step?'on':'')+'"></i>').join('');if(document.getElementById('files'))document.getElementById('files').addEventListener('change',e=>files([...e.target.files]))}
function setStatus(m,k=''){let x=document.getElementById('status');if(x)x.innerHTML='<div class="status '+k+'">'+m+'</div>'}
function resetLab(){if(confirm('Reset this participant journey?')){localStorage.removeItem('careerRiyaaz');location.reload()}}
function exportExcel(){let wb=XLSX.utils.book_new(),s={Sources:state.sources,Projects:state.projects,HardSkills:state.hard.map(x=>({skill:x,score:state.strength['hard|'+x]||''})),SoftSkills:state.soft.map(x=>({skill:x,score:state.strength['soft|'+x]||''})),Interests:Object.entries(state.interests).filter(([k,v])=>v.selected).map(([k,v])=>({pursuit:k,...v})),Market:Object.entries(state.market).map(([k,v])=>({opportunity:k,demand:v})),CareerReport:opportunities().map((x,i)=>({rank:i+1,territory:x.name,score:x.score}))};Object.entries(s).forEach(([n,a])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(a),n));XLSX.writeFile(wb,'career-riyaaz-workshop.xlsx')}
load();draw();
