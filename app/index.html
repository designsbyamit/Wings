<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beyond the Portfolio - Career Data Playground</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--ink:#191919;--muted:#77716a;--paper:#fff;--warm:#f4f1eb;--line:#ded9d0;--accent:#8b5d27;--good:#246b4a;--bad:#9b3d32}
*{box-sizing:border-box}body{margin:0;background:var(--warm);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif}.app{max-width:1120px;margin:auto;padding:30px 20px 70px}h1,h2,h3{font-family:Georgia,serif}h1{font-size:44px;line-height:1;margin:8px 0}h2{font-size:28px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:800;color:var(--accent)}button,label{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:11px 16px;font-weight:800;cursor:pointer}button.secondary{background:#eee9e1;color:var(--ink)}button:disabled{opacity:.45;cursor:wait}.tabs{display:flex;gap:5px;overflow:auto;margin:25px 0;border-bottom:1px solid var(--line)}.tabs button{background:none;color:#777;border-radius:0;white-space:nowrap}.tabs .on{color:#111;border-bottom:2px solid #111}.panel,.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.drop{border:2px dashed #c9c1b7;border-radius:18px;text-align:center;padding:35px;margin:20px 0;background:#fcfbf8}.drop input{display:none}.row{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:13px 0;border-bottom:1px solid #eee8df}.chip{display:inline-block;background:#eee9e1;border-radius:999px;padding:8px 11px;margin:4px;font-size:13px}.status{padding:12px 15px;border-radius:12px;background:#f3eee7;margin:12px 0}.success{background:#eaf4ee;color:var(--good)}.error{background:#f8eae7;color:var(--bad)}.muted{color:var(--muted)}pre{white-space:pre-wrap;max-height:360px;overflow:auto;background:#f7f5f1;border-radius:12px;padding:16px;font:13px/1.55 ui-monospace,SFMono-Regular,monospace}.source{margin:8px 0;padding:14px;border:1px solid var(--line);border-radius:12px}.bar{height:8px;background:#e9e3da;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#191919}.metric{font-size:30px;font-family:Georgia,serif}.empty{padding:35px;text-align:center;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px}.badge{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.step{display:grid;grid-template-columns:140px 1fr;background:#f4f1eb;padding:16px;border-radius:12px;margin:8px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{display:block}.step{grid-template-columns:1fr;gap:5px}h1{font-size:36px}}
</style>
</head>
<body><div class="app">
<div class="top"><div><div class="eyebrow">PORTFOLIO CAREER LAB</div><h1>Beyond the Portfolio</h1><p>Turn career evidence into your next direction.</p></div><div class="actions"><button class="secondary" onclick="clearAll()">Clear</button><button onclick="exportExcel()">Export Excel</button></div></div>
<div class="tabs" id="tabs"></div><main id="main"></main></div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const T=['Career Data','Strengths','Interests','Market','Sweet Spot','Roadmap'];let t=0,files=[],sources=[],projects=[],hard=[],soft=[],rawText='';
const skillLexicon={
'Interaction design':'interaction design|interaction designer|interaction patterns|ux design','User research':'user research|usability|research|interviews|user testing',
'Prototyping':'prototype|prototyping|wireframe|wireframing','Design systems':'design system|design systems|component library|tokens',
'Visual design':'visual design|visual design','Product strategy':'product strategy|product thinking|product vision|roadmap',
'Information architecture':'information architecture|ia|navigation','Service design':'service design|service blueprint',
'AI interaction design':'ai|generative ai|machine learning|conversational|copilot','Facilitation':'facilitat|workshop|co-creation',
'Storytelling':'storytell|presentation|narrative','Leadership':'lead|managed|management|mentored|team','Collaboration':'collaborat|cross-functional',
'Strategy':'strategy|strategic','Communication':'communicat','Mentoring':'mentor|coaching','Stakeholder management':'stakeholder'
};
const market=[['AI experience strategy',88,92,78],['Design systems leadership',82,74,91],['Research-led product strategy',76,80,86]];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setStatus(msg,kind=''){document.getElementById('status').innerHTML='<div class="status '+kind+'">'+msg+'</div>'}
function draw(){tabs.innerHTML=T.map((x,i)=>'<button class="'+(i===t?'on':'')+'" onclick="t='+i+';draw()">'+x+'</button>').join('');let s='';
if(t===0)s=career();
if(t===1)s=strengths();
if(t===2)s=interests();
if(t===3)s=marketView();
if(t===4)s=sweet();
if(t===5)s=roadmap();
main.innerHTML=s}
function career(){return '<div class="panel"><div class="eyebrow">PRE-WORK / ACTIVITY 1</div><h2>Career Data Playground</h2><p>Upload your career material. The browser now reads supported documents, extracts text, detects evidence and builds a clean working dataset.</p><div class="drop"><h3>Drop your career material here</h3><p>PDF, DOCX, TXT, MD, CSV, XLSX and JSON are parsed locally in your browser.</p><input id="f" type="file" multiple accept=".pdf,.docx,.txt,.md,.csv,.xlsx,.xls,.json"><label for="f">Choose files</label><div id="status"></div></div><div class="grid"><div class="card"><h3>Sources</h3>'+ (sources.length?sources.map(x=>'<div class="source"><b>'+esc(x.name)+'</b><div class="small muted">'+x.type+' · '+x.chars.toLocaleString()+' characters'+(x.sheets?' · '+x.sheets+' sheets':'')+'</div><div class="badge" style="color:'+(x.ok?'#246b4a':'#9b3d32')+'">'+(x.ok?'parsed':'needs attention')+'</div></div>').join(''):'<div class="empty">No files added yet.</div>')+'</div><div class="card"><h3>What was found</h3><div class="row"><span>Projects</span><b>'+projects.length+'</b></div><div class="row"><span>Hard skills</span><b>'+hard.length+'</b></div><div class="row"><span>Soft skills</span><b>'+soft.length+'</b></div><div class="row"><span>Extracted text</span><b>'+rawText.length.toLocaleString()+'</b></div><p class="small muted">Nothing is uploaded to a server. Parsing happens in this browser.</p></div></div>'+ (rawText?'<div class="card" style="margin-top:16px"><h3>Extracted career evidence</h3><pre>'+esc(rawText.slice(0,14000))+(rawText.length>14000?'\n\n[Preview truncated. Full extracted content remains in the working dataset.]':'')+'</pre></div>':'')+'</div>'}
async function handleFiles(list){setStatus('Reading '+list.length+' file'+(list.length>1?'s':'')+'...','');for(const file of list){try{const r=await parseFile(file);sources.push({name:file.name,type:r.type,chars:r.text.length,sheets:r.sheets,ok:true});rawText+=(rawText?'\n\n':'')+'===== '+file.name+' =====\n'+r.text;extractEvidence(r.text,file.name);setStatus('Parsed '+esc(file.name)+' successfully. '+rawText.length.toLocaleString()+' characters extracted.','success');}catch(e){console.error(e);sources.push({name:file.name,type:file.type||'unknown',chars:0,ok:false});setStatus('Could not parse '+esc(file.name)+': '+esc(e.message||e),'error')}}draw()}
async function parseFile(file){const n=file.name.toLowerCase();if(n.endsWith('.pdf'))return parsePdf(file);if(n.endsWith('.docx'))return parseDocx(file);if(n.endsWith('.xlsx')||n.endsWith('.xls'))return parseXlsx(file);if(n.endsWith('.csv'))return {type:'CSV',text:await file.text()};if(n.endsWith('.json'))return {type:'JSON',text:JSON.stringify(JSON.parse(await file.text()),null,2)};return {type:'Text',text:await file.text()}}
async function parsePdf(file){const data=new Uint8Array(await file.arrayBuffer()),pdf=await pdfjsLib.getDocument({data}).promise;let out=[];for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i),c=await p.getTextContent();out.push('--- Page '+i+' ---\n'+c.items.map(x=>x.str).join(' '))}return {type:'PDF',text:out.join('\n\n')}}
async function parseDocx(file){const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return {type:'DOCX',text:r.value}}
async function parseXlsx(file){const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});let out=[];for(const n of wb.SheetNames){const ws=wb.Sheets[n];out.push('--- Sheet: '+n+' ---\n'+XLSX.utils.sheet_to_csv(ws))}return {type:'XLSX',text:out.join('\n\n'),sheets:wb.SheetNames.length}}
function extractEvidence(text,source){const low=text.toLowerCase();for(const [name,rx] of Object.entries(skillLexicon)){if(new RegExp(rx,'i').test(low)){const isSoft=['Facilitation','Storytelling','Leadership','Collaboration','Strategy','Communication','Mentoring','Stakeholder management'].includes(name);const target=isSoft?soft:hard;if(!target.includes(name))target.push(name)}}const lines=text.split(/\n|•|·/).map(x=>x.trim()).filter(x=>x.length>35);const candidates=lines.filter(x=>/(project|case study|initiative|product|platform|experience|redesign|launched|led|built|designed|created|research)/i.test(x));for(const line of candidates.slice(0,8)){if(!projects.some(p=>p.name===line.slice(0,90)))projects.push({name:line.slice(0,90),source})}}
function strengths(){let h=hard.length?hard:['Interaction design','Research','Prototyping','Design systems','AI interaction design'],s=soft.length?soft:['Strategic thinking','Facilitation','Storytelling','Collaboration','Mentoring'];return '<div class="panel"><div class="eyebrow">ACTIVITY 2</div><h2>Find Your Strengths</h2><p>These are evidence signals, not a verdict. A skill appearing in a document means it is present in your history, not automatically that it is a strength.</p><div class="grid"><div class="card"><h3>Hard Skills</h3>'+h.map((x,i)=>'<div class="row"><span>'+esc(x)+'</span><b>'+Math.max(55,90-i*7)+'/100</b></div>').join('')+'</div><div class="card"><h3>Soft Skills</h3>'+s.map((x,i)=>'<div class="row"><span>'+esc(x)+'</span><b>'+Math.max(55,88-i*6)+'/100</b></div>').join('')+'</div></div></div>'}
function interests(){return '<div class="panel"><div class="eyebrow">ACTIVITY 3</div><h2>Ruchi Radar</h2><p>Separate genuine interest from borrowed inspiration. Rate each pursuit from 1-5.</p>'+['Pull','Energy','Depth','Persistence','Experimentation'].map((x,i)=>'<div class="row"><b>'+x+'</b><span>'+['Would you choose it without external validation?','Does doing it give energy back?','Have you gone beyond surface curiosity?','Do you keep returning to it?','Have you actually tried it?'][i]+'</span><input type="range" min="1" max="5" value="3"></div>').join('')+'</div>'}
function marketView(){return '<div class="panel"><div class="eyebrow">ACTIVITY 4</div><h2>Disha Guardrail</h2><p>Market demand is a signal, not your career direction. Adjust the demand signal and see how the ranking changes.</p>'+market.map((x,i)=>'<div class="row"><b>'+x[0]+'</b><input style="flex:1" type="range" min="0" max="100" value="'+x[1]+'" oninput="market['+i+'][1]=+this.value;draw()"><b>'+x[1]+'</b></div>').join('')+'</div>'}
function sweet(){return '<div class="panel"><div class="eyebrow">ACTIVITY 5</div><h2>Growth Sweet Spot</h2><p>Opportunity = hard skill fit + soft skill fit + interest fit + market fit + evidence strength. The current prototype uses your market signal plus baseline evidence and interest inputs.</p>'+market.map((x,i)=>{let score=Math.round(.3*78+.2*78+.2*78+.2*x[1]+.1*70);return '<div class="card" style="margin:10px 0"><div class="row"><b>#'+(i+1)+' '+x[0]+'</b><span class="metric">'+score+'</span></div><div class="bar"><i style="width:'+score+'%"></i></div></div>'}).join('')+'</div>'}
function roadmap(){return '<div class="panel"><div class="eyebrow">ACTIVITY 6</div><h2>Future Self Blueprint</h2><p>Turn a growth territory into evidence you can build, prove and position.</p>'+[['0-30 days','Explore one experiment'],['30-90 days','Build something meaningful'],['3-6 months','Create proof'],['6-12 months','Position yourself'],['12-24 months','Expand responsibility']].map(x=>'<div class="step"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')+'</div>'}
function exportExcel(){const rowsP=projects.length?projects:[{name:'No project inferred yet',source:''}];const data={Projects:rowsP.map((p,i)=>({project_id:i+1,project_name:p.name,source:p.source})),Hard_Skills:(hard.length?hard:['No skill detected']).map((x,i)=>({skill_id:i+1,skill_name:x,category:'Hard Skill'})),Soft_Skills:(soft.length?soft:['No skill detected']).map((x,i)=>({skill_id:i+1,skill_name:x,category:'Soft Skill'})),Sources:sources,Raw_Text:[{text:rawText}],Market_Signals:market.map(x=>({opportunity:x[0],demand_score:x[1],trend_score:x[2],geographic_fit:x[3]}))};const wb=XLSX.utils.book_new();for(const [name,arr] of Object.entries(data)){const ws=XLSX.utils.json_to_sheet(arr);XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31))}XLSX.writeFile(wb,'portfolio-career-dataset.xlsx')}
function clearAll(){files=[];sources=[];projects=[];hard=[];soft=[];rawText='';draw()}
document.addEventListener('change',e=>{if(e.target&&e.target.id==='f')handleFiles([...e.target.files])});
document.addEventListener('dragover',e=>{if(e.target.closest('.drop'))e.preventDefault()});
document.addEventListener('drop',e=>{const d=e.target.closest('.drop');if(d){e.preventDefault();handleFiles([...e.dataTransfer.files])}});
draw();
</script></body></html>
