name: Deploy Wings to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Validate Lakshya JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('public/app/Lakshya/index.html').read_text()
          start = html.rfind('<script>') + len('<script>')
          end = html.rfind('</script>')
          Path('/tmp/lakshya.js').write_text(html[start:end])
          PY
          node - <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const src=fs.readFileSync('/tmp/lakshya.js','utf8');
          try { new vm.Script(src,{filename:'lakshya.js'}); }
          catch(e) { console.error(e.stack); process.exit(1); }
          NODE


      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
