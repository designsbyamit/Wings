name: Deploy Portfolio Career Lab
on:
  push:
    branches: [main]
    paths:
      - 'portfolio-career-lab/**'
      - '.github/workflows/portfolio-career-lab-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio-career-lab/app/package.json

      - name: Build Career Data Playground
        working-directory: portfolio-career-lab/app
        run: |
          npm install
          npm run build

      - name: Assemble Pages site
        run: |
          rm -rf _site
          mkdir -p _site/app
          cp portfolio-career-lab/index.html _site/index.html
          cp portfolio-career-lab/README.md _site/README.md
          cp portfolio-career-lab/data-schema.md _site/data-schema.md
          cp portfolio-career-lab/algorithm.md _site/algorithm.md
          cp portfolio-career-lab/workshop/master-deck.md _site/master-deck.md
          cp portfolio-career-lab/facilitation/board-spec.md _site/board-spec.md
          cp portfolio-career-lab/content/participant-prework.md _site/participant-prework.md
          cp -R portfolio-career-lab/app/dist/. _site/app/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
